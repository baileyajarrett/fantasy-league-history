      <div class="sc-sub">${efficiencyLabel(eff.pct)}</div>
    </div>`;

  let fifthCard, sixthCard;
  if(year == null){
    const pr = playoffRateFor(ownerKey);
    const titles = titlesFor(ownerKey);
    fifthCard = `
      <div class="stat-card">
        <div class="sc-label">Playoff Rate</div>
        <div class="sc-value">${Math.round(pr.pct*100)}%</div>
        <div class="sc-sub">(${pr.appearances} of ${pr.totalSeasons} seasons)</div>
      </div>`;
    sixthCard = `
      <div class="stat-card">
        <div class="sc-label">Titles</div>
        <div class="sc-value">${titles.count}</div>
        <div class="sc-sub">${titles.years.length ? '(' + titles.years.join(', ') + ')' : 'Still searching'}</div>
      </div>`;
  } else {
    const madePlayoffs = (PLAYOFF_TEAMS.get(year) || new Set()).has(ownerKey);
    const season = SEASONS.find(s => s.year === year);
    const isChamp = season && season.championKey === ownerKey;
    const isRunnerUp = season && season.runnerUpKey === ownerKey;
    const isLoser = season && season.loserKey === ownerKey;
    const isSecondLoser = season && season.secondLoserKey === ownerKey;
    fifthCard = `
      <div class="stat-card">
        <div class="sc-label">Made Playoffs</div>
        <div class="sc-value">${madePlayoffs ? 'Yes' : 'No'}</div>
        <div class="sc-sub">${year}</div>
      </div>`;
    sixthCard = `
      <div class="stat-card">
        <div class="sc-label">Season Result</div>
        <div class="sc-value">${isChamp ? '\uD83C\uDFC6 Champion' : isRunnerUp ? 'Runner-Up' : isLoser ? '\uD83E\uDEA0 Toilet Bowl' : isSecondLoser ? 'Toilet Bowl Runner-Up' : madePlayoffs ? 'Playoffs' : 'Missed'}</div>
        <div class="sc-sub">${year}</div>

  return `<div class="stat-card-grid">${recordCard}${expectedCard}${luckCard}${effCard}${fifthCard}${sixthCard}</div>`;
}

function draftTendencies(){
  // All-time, across every season on record: which position and which NFL
  // team a manager tends to draft most often.
  const byOwner = new Map(); // ownerKey -> { positions: Map, teams: Map, totalPicks }
  for(const picks of DRAFTS.values()){
    for(const p of picks){
      if(!byOwner.has(p.ownerKey)) byOwner.set(p.ownerKey, { positions: new Map(), teams: new Map(), totalPicks: 0 });
      const rec = byOwner.get(p.ownerKey);
      rec.totalPicks += 1;
      const meta = PLAYERS.get(p.playerId);
      if(meta && meta.position){ rec.positions.set(meta.position, (rec.positions.get(meta.position)||0) + 1); }
      if(meta && meta.team){ rec.teams.set(meta.team, (rec.teams.get(meta.team)||0) + 1); }
    }
  }
  const topOf = (map) => {
    let best = null;
    for(const [k,v] of map.entries()){ if(!best || v > best[1]) best = [k,v]; }
    return best;
  };
  return Array.from(byOwner.entries()).map(([ownerKey, rec]) => {
    const topPos = topOf(rec.positions);
    const topTeam = topOf(rec.teams);
    return { ownerKey, totalPicks: rec.totalPicks, topPos, topTeam };
  }).sort((a,b) => b.totalPicks - a.totalPicks);
}

function renderDraftTendencies(){
  const rows = draftTendencies();
  if(rows.length === 0) return '';
  const body = rows.map(r => `
    <tr>
      <td>${teamLabel(r.ownerKey,'sm')}</td>
      <td>${r.topPos ? `${escapeHtml(r.topPos[0])} <span class="muted">(${r.topPos[1]} of ${r.totalPicks})</span>` : '&mdash;'}</td>
      <td>${r.topTeam ? `${escapeHtml(r.topTeam[0])} <span class="muted">(${r.topTeam[1]} of ${r.totalPicks})</span>` : '&mdash;'}</td>
      <td class="num">${r.totalPicks}</td>
    </tr>`).join('');
  return `
    <div class="card">
      <h3 class="card-title">Draft Tendencies (All-Time)</h3>
      <table><thead><tr><th>Team</th><th>Favorite Position</th><th>Favorite NFL Team</th><th class="num">Total Picks</th></tr></thead>

// ---- Section 4: Deeper Draft Analytics ----
// No real market ADP is available from Sleeper, so "value" here is relative
// to that same draft's own round average — i.e. did this pick outproduce a
// typical pick at that draft position, in that season's scoring environment.

function draftValueAnalysis(){
  const allPicks = [];
  for(const [year, picks] of DRAFTS.entries()){
    const byRound = new Map();
    for(const p of picks){
      if(!byRound.has(p.round)) byRound.set(p.round, []);
      byRound.get(p.round).push(p.seasonPoints);
    }
    const roundAvg = new Map();
    for(const [round, ptsList] of byRound.entries()){
      roundAvg.set(round, ptsList.reduce((a,b)=>a+b,0)/ptsList.length);
    }
    for(const p of picks){
      const avg = roundAvg.get(p.round);
      allPicks.push({ ...p, year, roundAvg: avg, valueOverAvg: p.seasonPoints - avg });
    }
  }
  return allPicks;
}

function hitRateByRound(allPicks){
  const byRound = new Map();
  for(const p of allPicks){
    if(!byRound.has(p.round)) byRound.set(p.round, { hits:0, total:0 });
    const r = byRound.get(p.round);
    r.total++; if(p.valueOverAvg > 0) r.hits++;
  }
  return Array.from(byRound.entries()).sort((a,b)=>a[0]-b[0]).map(([round,r]) => ({ round, hitRate: r.hits/r.total, total: r.total }));
}

function draftValueByManager(allPicks){
  const byOwner = new Map();
  for(const p of allPicks){
    if(!byOwner.has(p.ownerKey)) byOwner.set(p.ownerKey, { hits:0, total:0, sumValue:0 });
    const r = byOwner.get(p.ownerKey);
    r.total++; r.sumValue += p.valueOverAvg; if(p.valueOverAvg > 0) r.hits++;
  }
  return Array.from(byOwner.entries()).map(([ownerKey,r]) => ({
    ownerKey, hitRate: r.hits/r.total, avgValue: r.sumValue/r.total, total: r.total
  })).sort((a,b) => b.hitRate - a.hitRate);
}

function positionRoundTendencies(){
  const byOwner = new Map(); // ownerKey -> Map(position -> {sumRound, count})
  for(const picks of DRAFTS.values()){
    for(const p of picks){
      const meta = PLAYERS.get(p.playerId);
      if(!meta || !meta.position) continue;
      if(!byOwner.has(p.ownerKey)) byOwner.set(p.ownerKey, new Map());
      const m = byOwner.get(p.ownerKey);
      if(!m.has(meta.position)) m.set(meta.position, { sumRound:0, count:0 });
      const r = m.get(meta.position);
      r.sumRound += p.round; r.count++;
    }
  }
  return byOwner;
}

function renderDraftValueSection(){
  const allPicks = draftValueAnalysis();
  if(allPicks.length === 0) return '';
  const hitRates = hitRateByRound(allPicks);
  const byManager = draftValueByManager(allPicks);
  const bestPicks = allPicks.slice().sort((a,b) => b.valueOverAvg - a.valueOverAvg).slice(0,5);
  const worstPicks = allPicks.slice().sort((a,b) => a.valueOverAvg - b.valueOverAvg).slice(0,5);

  const pickLine = (p) => `
    <li>

  const hitRateRows = hitRates.map(r => `
    <tr><td class="num">Round ${r.round}</td><td class="num">${Math.round(r.hitRate*100)}%</td><td class="num">${r.total}</td></tr>`).join('');

  const managerRows = byManager.map(r => `
    <tr><td>${teamLabel(r.ownerKey,'sm')}</td><td class="num">${Math.round(r.hitRate*100)}%</td><td class="num">${r.avgValue>=0?'+':''}${fmt1(r.avgValue)}</td><td class="num">${r.total}</td></tr>`).join('');

  return `
    <div class="grid-2">
      <div class="card">
        <h3 class="card-title">Best Picks (vs. Round Average)</h3>
        <ul class="record-list">${bestPicks.map(pickLine).join('')}</ul>

        <h3 class="card-title">Worst Picks (vs. Round Average)</h3>
        <ul class="record-list">${worstPicks.map(pickLine).join('')}</ul>
      </div>
    </div>
    <div class="grid-2">
      <div class="card">
        <h3 class="card-title">Hit Rate by Round</h3>
        <div style="overflow-x:auto;">
        <table><thead><tr><th class="num">Round</th><th class="num">Hit Rate</th><th class="num">Picks</th></tr></thead>
        <tbody>${hitRateRows}</tbody></table>
        </div>
      </div>
      <div class="card">
        <h3 class="card-title">Hit Rate by Manager</h3>
        <div style="overflow-x:auto;">
        <table><thead><tr><th>Team</th><th class="num">Hit Rate</th><th class="num">Avg Value</th><th class="num">Picks</th></tr></thead>
        <tbody>${managerRows}</tbody></table>
        </div>
      </div>
    </div>
    <p class="muted">"Hit" means the pick outscored the average player taken in that round that season. No external market ADP is available, so this measures value against your own league's draft, not the wider fantasy market.</p>
  `;
}

function renderPositionRoundTendencies(){
  const byOwner = positionRoundTendencies();
  if(byOwner.size === 0) return '';
  const allPositions = new Set();
  for(const m of byOwner.values()) for(const pos of m.keys()) allPositions.add(pos);
  const positions = Array.from(allPositions).sort((a,b) => {
    const ia = POSITION_ORDER.indexOf(a), ib = POSITION_ORDER.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b);
    if(ia===-1) return 1; if(ib===-1) return -1;
    return ia-ib;
  });
  const header = positions.map(p => `<th class="num">${escapeHtml(p)}</th>`).join('');
  const rows = Array.from(byOwner.keys()).sort((a,b) => TEAMS.get(a).name.localeCompare(TEAMS.get(b).name)).map(ownerKey => {
    const m = byOwner.get(ownerKey);
    const cells = positions.map(pos => {
      const r = m.get(pos);
      return `<td class="num">${r ? fmt1(r.sumRound/r.count) : '&mdash;'}</td>`;
    }).join('');
    return `<tr><td>${teamLabel(ownerKey,'sm')}</td>${cells}</tr>`;
  }).join('');
  return `
    <div class="card">
      <h3 class="card-title">Position Tendencies Over Time</h3>
      <div style="overflow-x:auto;">
      <table><thead><tr><th>Team</th>${header}</tr></thead><tbody>${rows}</tbody></table>
      </div>
      <p class="muted" style="margin-top:8px;">Average draft round a manager has spent on each position, across every draft on record. Lower = reaches for that position early; higher = tends to wait.</p>
    </div>`;
}

function renderDraftBoard(year){
  const picks = DRAFTS.get(year);
  if(!picks || picks.length === 0) return `<p class="muted">No draft recorded for ${year}.</p>`;

  const season = SEASONS.find(s => s.year === year);
  const numTeams = season ? season.standings.length : new Set(picks.map(p=>p.ownerKey)).size;
  const rounds = Array.from(new Set(picks.map(p=>p.round))).sort((a,b)=>a-b);

  // Prefer Sleeper's own draft_slot (stable per team all draft long); fall
  // back to computing it from the overall pick number if it's missing.
  const slotOf = (p) => p.draftSlot || (((p.pickNo-1) % numTeams) + 1);
  const slots = Array.from(new Set(picks.map(slotOf))).sort((a,b)=>a-b);

  const grid = new Map(); // "round-slot" -> pick
  for(const p of picks) grid.set(`${p.round}-${slotOf(p)}`, p);

  const slotOwner = new Map(); // slot -> ownerKey (from round 1, or whichever round has it)
  for(const p of picks){ const s = slotOf(p); if(!slotOwner.has(s)) slotOwner.set(s, p.ownerKey); }

  const header = slots.map(s => `<th>${slotOwner.has(s) ? escapeHtml(TEAMS.get(slotOwner.get(s)).name.split(' ')[0]) : 'Slot '+s}</th>`).join('');
  const rows = rounds.map(r => {
    const cells = slots.map(s => {
      const p = grid.get(`${r}-${s}`);
      if(!p) return `<td class="draft-cell empty">&mdash;</td>`;
      return `<td class="draft-cell">
        <div class="draft-pick-player">${escapeHtml(playerLabel(p.playerId))}${p.isKeeper ? '<span class="keeper-badge">KEPT</span>' : ''}</div>
        <div class="draft-pick-pts muted">${fmt1(p.seasonPoints)} pts</div>
      </td>`;
    }).join('');
    return `<tr><td class="num round-label">R${r}</td>${cells}</tr>`;
  }).join('');

  const lateRound = picks.filter(p => p.round >= 4);
  const earlyRound = picks.filter(p => p.round <= 2);
  const steal = lateRound.length ? lateRound.reduce((m,c) => c.seasonPoints > m.seasonPoints ? c : m) : null;
  const bust = earlyRound.length ? earlyRound.reduce((m,c) => c.seasonPoints < m.seasonPoints ? c : m) : null;

  return `
    ${steal ? `<p class="muted">Steal of the draft: <strong>${escapeHtml(playerLabel(steal.playerId))}</strong> (round ${steal.round}, ${fmt1(steal.seasonPoints)} pts) to ${escapeHtml(TEAMS.get(steal.ownerKey).name)}</p>` : ''}
    ${bust ? `<p class="muted">Biggest bust: <strong>${escapeHtml(playerLabel(bust.playerId))}</strong> (round ${bust.round}, ${fmt1(bust.seasonPoints)} pts) to ${escapeHtml(TEAMS.get(bust.ownerKey).name)}</p>` : ''}
    <div class="h2h-scroll" style="margin-top:10px;">
    <table class="draft-board">
      <thead><tr><th>&nbsp;</th>${header}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  `;
}

function renderDraft(){
  const years = Array.from(DRAFTS.keys()).sort((a,b) => b-a);

function weeklyStdev(ownerKey, year){
  let entries = GAME_ENTRIES.filter(g => g.teamKey === ownerKey);
  if(year != null) entries = entries.filter(g => g.season === year);
  if(entries.length < 2) return 0;
  const mean = entries.reduce((s,g) => s+g.pf, 0) / entries.length;
  const variance = entries.reduce((s,g) => s + (g.pf-mean)*(g.pf-mean), 0) / entries.length;
  return Math.sqrt(variance);
}

function renderAwardsContent(year){
  const keys = Array.from(TEAMS.keys()).filter(k => year == null || TEAMS.get(k).seasons.some(s => s.year === year));
  if(keys.length === 0) return `<p class="muted">No data for ${year}.</p>`;

  const bySrd = keys.map(k => ({ ownerKey:k, val: weeklyStdev(k, year) }));
  const consistentPool = bySrd.filter(x => x.val > 0);
  const mostConsistent = (consistentPool.length?consistentPool:bySrd).slice().sort((a,b) => a.val-b.val)[0];
  const mostVolatile = bySrd.slice().sort((a,b) => b.val-a.val)[0];

  const byBench = keys.map(k => ({ ownerKey:k, val: benchTaxFor(k, year) }));
  const worstBenchTax = byBench.slice().sort((a,b) => b.val-a.val)[0];
  const bestLineupSetter = byBench.slice().sort((a,b) => a.val-b.val)[0];

  const byLuck = keys.map(k => {
    const l = luckFor(k, year);
    return { ownerKey:k, delta: l.actualWins - l.expectedWins, ...l };
  });
  const luckiest = byLuck.slice().sort((a,b) => b.delta-a.delta)[0];
  const unluckiest = byLuck.slice().sort((a,b) => a.delta-b.delta)[0];

  const byTx = keys.map(k => ({ ownerKey:k, ...txStatsFor(k, year) }));
  const tradeHawk = byTx.slice().sort((a,b) => b.trades-a.trades)[0];
  const waiverWizard = byTx.slice().sort((a,b) => b.waiverAdds-a.waiverAdds)[0];

  const byEff = keys.map(k => coachingEffFor(k, year)).map((e,i) => ({ ownerKey: keys[i], ...e })).filter(e => e.pct != null);
  const bestManager = byEff.length ? byEff.slice().sort((a,b) => b.pct-a.pct)[0] : null;
  const autopilotGM = byEff.length ? byEff.slice().sort((a,b) => a.pct-b.pct)[0] : null;

  const card = (name, ownerKey, stat, desc) => `
    <div class="award-card">
      <div class="award-name">${name}</div>
      <div class="award-winner">${teamAvatarHtml(TEAMS.get(ownerKey))}<span class="tname">${escapeHtml(TEAMS.get(ownerKey).name)}</span></div>
      <div class="award-stat">${stat}</div>
      <div class="award-desc">${desc}</div>
    </div>`;

  const scopeWord = year == null ? 'career-wide' : `in ${year}`;

  return `
    <div class="award-grid">
      ${card('Mr. Consistent', mostConsistent.ownerKey, `\u03c3 = ${fmt1(mostConsistent.val)} pts/week`, `Smallest week-to-week scoring swings, ${scopeWord}.`)}
      ${card('Boom or Bust', mostVolatile.ownerKey, `\u03c3 = ${fmt1(mostVolatile.val)} pts/week`, `Biggest week-to-week scoring swings, ${scopeWord}.`)}
      ${card('Bench Tax', worstBenchTax.ownerKey, `${fmt1(worstBenchTax.val)} pts left on the bench`, `Most points stranded on the bench, ${scopeWord}.`)}
      ${card('Sharpest Lineup Setter', bestLineupSetter.ownerKey, `${fmt1(bestLineupSetter.val)} pts left on the bench`, `Fewest points stranded on the bench, ${scopeWord}.`)}
      ${card('Luckiest', luckiest.ownerKey, `${luckiest.delta>=0?'+':''}${fmt1(luckiest.delta)} wins vs. expected`, `${luckiest.actualWins} actual wins vs. ${fmt1(luckiest.expectedWins)} expected, ${scopeWord}.`)}
      ${card('Unluckiest', unluckiest.ownerKey, `${fmt1(unluckiest.delta)} wins vs. expected`, `${unluckiest.actualWins} actual wins vs. ${fmt1(unluckiest.expectedWins)} expected, ${scopeWord}.`)}
      ${tradeHawk.trades > 0 ? card('Trade Hawk', tradeHawk.ownerKey, `${tradeHawk.trades} trades`, `Most trades completed, ${scopeWord}.`) : ''}
      ${waiverWizard.waiverAdds > 0 ? card('Waiver Wire Wizard', waiverWizard.ownerKey, `${waiverWizard.waiverAdds} waiver adds`, `Most successful waiver claims, ${scopeWord}.`) : ''}
      ${bestManager ? card('Best Manager', bestManager.ownerKey, `${fmt1(bestManager.pct)}% of optimal`, `Set lineups closest to their own best-possible score, ${scopeWord}.`) : ''}
      ${autopilotGM ? card('Autopilot GM', autopilotGM.ownerKey, `${fmt1(autopilotGM.pct)}% of optimal`, `Furthest from their own best-possible lineup, ${scopeWord}.`) : ''}
    </div>
    <p class="muted" style="margin-top:16px;">"Expected wins" compares each week's score against the rest of the league that week &mdash; a team with a top-scoring week "expected" a win regardless of who they were actually paired against. "% of optimal" compares actual starting lineup points to the best lineup that roster could have started that week.</p>
  `;
}

function renderHallOfShame(){
  const losses = GAME_ENTRIES.filter(g => g.margin < 0).sort((a,b) => b.pf-a.pf).slice(0,5);
  const backdoorWins = GAME_ENTRIES.filter(g => g.margin > 0).sort((a,b) => a.pf-b.pf).slice(0,5);

  const heartbreakList = losses.map(g => `
    <li>
      <div class="shame-headline">${escapeHtml(TEAMS.get(g.teamKey).name)} scored ${fmt1(g.pf)} &mdash; and still lost</div>
      <div class="shame-sub">Fell to ${escapeHtml(TEAMS.get(g.oppKey).name)}'s ${fmt1(g.pa)} in ${g.season}, week ${g.week}${g.isPlayoff?' (playoffs)':''}</div>
    </li>`).join('') || '<li class="muted">No data yet</li>';

  const backdoorList = backdoorWins.map(g => `
    <li>
      <div class="shame-headline">${escapeHtml(TEAMS.get(g.teamKey).name)} won with just ${fmt1(g.pf)} points</div>
      <div class="shame-sub">Squeaked past ${escapeHtml(TEAMS.get(g.oppKey).name)}'s ${fmt1(g.pa)} in ${g.season}, week ${g.week}${g.isPlayoff?' (playoffs)':''}</div>
    </li>`).join('') || '<li class="muted">No data yet</li>';

  const letdowns = CHAMP_GAMES.filter(c => c.runnerPts > c.champPts);
  const letdownList = letdowns.map(c => `
    <li>
      <div class="shame-headline">${c.year}: ${escapeHtml(TEAMS.get(c.runnerKey).name)} outscored the champion &mdash; and still lost the title</div>
      <div class="shame-sub">${escapeHtml(TEAMS.get(c.runnerKey).name)} put up ${fmt1(c.runnerPts)} to ${escapeHtml(TEAMS.get(c.champKey).name)}'s ${fmt1(c.champPts)} in the championship, but the ring still went to ${escapeHtml(TEAMS.get(c.champKey).name)}.</div>
    </li>`).join('') || '<li class="muted">No championship letdowns on record &mdash; every champion has outscored their opponent in the final.</li>';

  const bubbleTeams = [];
  for(const season of SEASONS){
    const playoffSet = PLAYOFF_TEAMS.get(season.year);
    if(!playoffSet || playoffSet.size === 0 || playoffSet.size >= season.standings.length) continue;
    const ranked = season.standings.slice().sort((a,b) => (b.wins-a.wins) || (b.pf-a.pf));
    const lastIn = ranked.filter(s => playoffSet.has(s.ownerKey)).pop();
    const firstOut = ranked.find(s => !playoffSet.has(s.ownerKey));
    if(lastIn && firstOut){
      bubbleTeams.push({ year: season.year, lastIn, firstOut, gap: lastIn.wins - firstOut.wins });
    }
  }
  bubbleTeams.sort((a,b) => a.gap - b.gap);
  const bubbleList = bubbleTeams.slice(0,5).map(b => `
    <li>
      <div class="shame-headline">${b.year}: ${escapeHtml(TEAMS.get(b.firstOut.ownerKey).name)} missed the playoffs by a hair</div>
      <div class="shame-sub">Finished ${b.firstOut.wins}-${b.firstOut.losses} (${fmt1(b.firstOut.pf)} pts) &mdash; ${escapeHtml(TEAMS.get(b.lastIn.ownerKey).name)} snuck in at ${b.lastIn.wins}-${b.lastIn.losses} (${fmt1(b.lastIn.pf)} pts)</div>
    </li>`).join('') || '<li class="muted">No data yet</li>';

  const blunders = BENCH_BLUNDERS.slice(0,5).map(b => `
    <li>
      <div class="shame-headline">${escapeHtml(TEAMS.get(b.ownerKey).name)} left ${escapeHtml(playerLabel(b.benchPlayerId))} on the bench</div>
      <div class="shame-sub">${playerLabel(b.benchPlayerId)} scored ${fmt1(b.benchPts)} on the bench while starting ${escapeHtml(playerLabel(b.starterPlayerId))} (${fmt1(b.starterPts)} pts) &mdash; ${b.year} week ${b.week}, ${fmt1(b.delta)} pts left on the table</div>
    </li>`).join('') || '<li class="muted">No data yet</li>';

  const seasonLuck = [];
  for(const [ownerKey, byYear] of LUCK.entries()){
    for(const [year, l] of byYear.entries()){
      seasonLuck.push({ ownerKey, year, delta: l.actualWins - l.expectedWins, ...l });
    }
  }
  const luckiestSeasons = seasonLuck.slice().sort((a,b) => b.delta-a.delta).slice(0,5);
  const unluckiestSeasons = seasonLuck.slice().sort((a,b) => a.delta-b.delta).slice(0,5);
  const luckySeasonList = luckiestSeasons.map(s => `
    <li>
      <div class="shame-headline">${s.year}: ${escapeHtml(TEAMS.get(s.ownerKey).name)} got away with it</div>
      <div class="shame-sub">${s.actualWins} actual wins vs. ${fmt1(s.expectedWins)} expected &mdash; ${s.delta>=0?'+':''}${fmt1(s.delta)} wins of pure luck</div>
    </li>`).join('') || '<li class="muted">No data yet</li>';
  const unluckySeasonList = unluckiestSeasons.map(s => `
    <li>
      <div class="shame-headline">${s.year}: ${escapeHtml(TEAMS.get(s.ownerKey).name)} deserved better</div>
      <div class="shame-sub">${s.actualWins} actual wins vs. ${fmt1(s.expectedWins)} expected &mdash; ${fmt1(s.delta)} wins of bad luck</div>
    </li>`).join('') || '<li class="muted">No data yet</li>';

  const worstWeeks = EFFICIENCY_WEEKS.filter(w => w.optimalPts > 0).slice().sort((a,b) => a.pct-b.pct).slice(0,5);
  const worstManagedList = worstWeeks.map(w => `
    <li>
      <div class="shame-headline">${escapeHtml(TEAMS.get(w.ownerKey).name)} left ${fmt1(w.optimalPts-w.actualPts)} points on the table</div>
      <div class="shame-sub">Scored ${fmt1(w.actualPts)} of a possible ${fmt1(w.optimalPts)} (${fmt1(w.pct)}%) &mdash; ${w.year} week ${w.week}</div>
    </li>`).join('') || '<li class="muted">No data yet</li>';

  const bestMissed = bestNonPlayoffTeamEver();

  return `
    <h2 class="section-title">Hall of Shame</h2>
    <div class="grid-2">
      <div class="card"><h3 class="card-title">Heartbreak Losses</h3><ul class="shame-list">${heartbreakList}</ul></div>
      <div class="card"><h3 class="card-title">Backdoor Wins</h3><ul class="shame-list">${backdoorList}</ul></div>
      <div class="card"><h3 class="card-title">Championship Letdowns</h3><ul class="shame-list">${letdownList}</ul></div>
      <div class="card"><h3 class="card-title">Missed the Playoffs by a Hair</h3><ul class="shame-list">${bubbleList}</ul></div>
      <div class="card"><h3 class="card-title">Luckiest Seasons Ever</h3><ul class="shame-list">${luckySeasonList}</ul></div>
      <div class="card"><h3 class="card-title">Unluckiest Seasons Ever</h3><ul class="shame-list">${unluckySeasonList}</ul></div>
    </div>
    ${renderToiletBowlHistory()}
    <div class="grid-2">
      <div class="card">
        <h3 class="card-title">Worst Bench Blunders</h3>
        <ul class="shame-list">${blunders}</ul>
      </div>
      <div class="card">
        <h3 class="card-title">Worst-Managed Weeks</h3>
        <ul class="shame-list">${worstManagedList}</ul>
        <p class="muted" style="margin-top:8px;">Biggest gaps between what a lineup scored and the best lineup that roster could have started that week.</p>
      </div>
    </div>
    ${bestMissed ? `
    <div class="card">
      <h3 class="card-title">The "What If" File: Best Team to Ever Miss the Playoffs</h3>
      <ul class="shame-list">
        <li>
          <div class="shame-headline">${bestMissed.year}: ${escapeHtml(TEAMS.get(bestMissed.ownerKey).name)} was too good to be sitting at home</div>
          <div class="shame-sub">Finished ${bestMissed.wins}-${bestMissed.losses}${bestMissed.ties?('-'+bestMissed.ties):''} (${fmt3(bestMissed.winPct)}, ${fmt1(bestMissed.pf)} pts) and still didn't make the playoffs &mdash; the best non-playoff season on record.</div>
        </li>
      </ul>
    </div>` : ''}
  `;
}

  overview: renderOverview, seasons: renderSeasons, h2h: renderH2H, records: renderRecords,
  trends: renderTrends,
  draft: renderDraft, transactions: renderTransactions, awards: renderAwards, shame: renderHallOfShame,
  teams: renderTeams
};

function showTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('content').innerHTML = RENDERERS[tab]();
  if(tab === 'seasons'){
    const yearSel = document.getElementById('sim-year');
    const aSel = document.getElementById('sim-teamA');
    const bSel = document.getElementById('sim-teamB');
    const result = document.getElementById('sim-result');
    if(yearSel && aSel && bSel && result){
      if(bSel.options.length > 1) bSel.selectedIndex = 1;
      const update = () => { result.innerHTML = renderScheduleSimResult(Number(yearSel.value), aSel.value, bSel.value); };
      yearSel.addEventListener('change', update);
      aSel.addEventListener('change', update);
      bSel.addEventListener('change', update);
      update();
    }
  }
  if(tab === 'teams'){
    document.getElementById('team-grid').addEventListener('click', (e) => {
      const card = e.target.closest('.team-card');
      if(!card) return;
      const slot = document.getElementById('team-detail-slot');
      const key = card.dataset.owner;
      if(slot.dataset.open === key){ slot.innerHTML = ''; slot.dataset.open = ''; return; }
      slot.innerHTML = renderTeamDetail(key);
      slot.dataset.open = key;

      const yearSel = document.getElementById('team-detail-year');
      const statCards = document.getElementById('team-stat-cards');
      if(yearSel && statCards){
        yearSel.addEventListener('change', () => {
          statCards.innerHTML = renderTeamStatCards(key, yearSel.value === 'all' ? null : Number(yearSel.value));
        });
      }
      const rivalList = document.getElementById('h2h-summary-list');
      if(rivalList){
        rivalList.addEventListener('click', (ev) => {
          const li = ev.target.closest('li');
          if(!li) return;
          PENDING_RIVALRY = { a: key, b: li.dataset.rival };
          showTab('h2h');
        });
      }

      slot.scrollIntoView({ behavior:'smooth', block:'nearest' });
    });
  }
  if(tab === 'h2h'){
    const selA = document.getElementById('rivalry-a');
    const selB = document.getElementById('rivalry-b');
    const logEl = document.getElementById('rivalry-log');
    if(selA && selB){
      if(PENDING_RIVALRY){
        selA.value = PENDING_RIVALRY.a;
        selB.value = PENDING_RIVALRY.b;
        PENDING_RIVALRY = null;
      } else if(selB.options.length > 1){
        selB.selectedIndex = 1;
      }
      const update = () => { logEl.innerHTML = renderRivalryLog(selA.value, selB.value); };
      selA.addEventListener('change', update);
      selB.addEventListener('change', update);
      update();
    }
  }
  if(tab === 'trends'){
    const sel = document.getElementById('trends-year');
    const content = document.getElementById('trends-content');
    if(sel && content){
      const update = () => { content.innerHTML = renderTrendsContent(sel.value === 'all' ? null : Number(sel.value)); };
      sel.addEventListener('change', update);
      update();
    }
  }
  if(tab === 'draft'){
    const sel = document.getElementById('draft-year');
    const board = document.getElementById('draft-board');
    if(sel && board){
      const update = () => { board.innerHTML = renderDraftBoard(Number(sel.value)); };
      sel.addEventListener('change', update);
      update();
    }
  }
  if(tab === 'transactions'){
    const sel = document.getElementById('tx-year');
    const content = document.getElementById('tx-content');
    if(sel && content){
      const update = () => {
        const year = sel.value === 'all' ? null : Number(sel.value);
        const { html } = renderTransactionSummary(year);
        content.innerHTML = html + (year != null ? renderTransactionLog(year) : '');
      };
      sel.addEventListener('change', update);
      update();
    }
  }
  if(tab === 'awards'){
    const sel = document.getElementById('awards-year');
    const content = document.getElementById('awards-content');
    if(sel && content){
      const update = () => { content.innerHTML = renderAwardsContent(sel.value === 'all' ? null : Number(sel.value)); };
      sel.addEventListener('change', update);
      update();
    }
  }
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if(btn) showTab(btn.dataset.tab);
});

async function init(){
  try{
    const { bundles, playersById } = await loadAll();
    processSeasons(bundles, playersById);
    renderMasthead();
    showTab('overview');
  } catch(err){
    console.error(err);
    document.getElementById('content').innerHTML = `
      <div class="status-box error">
        <div>&#9888; Couldn't pull the box scores.</div>
        <div class="muted" style="margin-top:6px;">${escapeHtml(err.message || 'Unknown error')}</div>
        <button class="retry-btn" onclick="init()">Try again</button>
      </div>`;
  }
}
init();
</script>
</body>
</html>
