<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-stadium:#121C26;
    --bg-stadium-2:#0D1620;
    --turf:#2F4E3D;
    --turf-light:#3C5F4B;
    --cream:#EFE7D6;
    --cream-2:#E7DCC5;
    --amber:#E8A33D;
    --amber-dim:#C68A2E;
    --oxblood:#8C3331;
    --oxblood-light:#B04B44;
    --chalk:#F7F4EC;
    --ink:#1B2A3D;
    --ink-soft:#4A5568;
    --line:#C9BC9C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232,163,61,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-stadium) 0%, var(--bg-stadium-2) 100%);
    color:var(--chalk);
    font-family:'IBM Plex Serif', serif;
    min-height:100vh;
  }
  .wrap{max-width:none;margin:0 auto;padding:28px clamp(20px, 5vw, 140px) 80px;}

  /* ---------- Masthead ---------- */
  .masthead{
    display:flex;align-items:center;gap:18px;
    padding-bottom:22px;margin-bottom:6px;
    border-bottom:3px double var(--line);
  }
  .masthead img.league-avatar{
    width:56px;height:56px;border-radius:6px;object-fit:cover;
    border:2px solid var(--amber);flex-shrink:0;
  }
  .masthead-text .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--amber); margin:0 0 4px;
  }
  .masthead-text h1{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:800;font-size:clamp(28px,5vw,44px);
    letter-spacing:.01em;margin:0;line-height:1;color:var(--chalk);
    text-transform:uppercase;
  }
  .masthead-text .sub{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:#9FB0A6;margin-top:5px;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;gap:2px;margin:22px 0 26px;flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    background:transparent;border:none;color:#8B9AA5;
    padding:11px 16px;cursor:pointer;position:relative;
    border-top-left-radius:4px;border-top-right-radius:4px;
    transition:color .15s;
  }
  .tab-btn:hover{color:var(--chalk);}
  .tab-btn.active{color:var(--amber);background:rgba(232,163,61,0.08);}
  .tab-btn.active::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--amber);
  }

  /* ---------- Ledger page/card ---------- */
  .page{
    background:var(--cream);
    color:var(--ink);
    border-radius:3px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    position:relative;
  }
  .page::before{
    content:'';position:absolute;inset:0;
    background-image:repeating-linear-gradient(180deg, transparent 0, transparent 27px, rgba(27,42,61,0.05) 28px);
    pointer-events:none;border-radius:3px;
  }
  .page-inner{position:relative;padding:26px 26px 30px;}
  .card{
    background:var(--cream);color:var(--ink);border-radius:3px;
    box-shadow:0 10px 24px rgba(0,0,0,0.28);padding:20px 22px;margin-bottom:18px;
  }
  h2.section-title{
    font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    font-size:22px;text-transform:uppercase;letter-spacing:.02em;
    margin:0 0 14px;color:var(--ink);
    border-bottom:2px solid var(--turf);padding-bottom:8px;
  }
  h3.card-title{
    font-family:'Big Shoulders Display',sans-serif;font-weight:700;
    font-size:17px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;color:var(--ink);
  }
  .muted{color:var(--ink-soft);font-size:13px;}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  table.narrative{font-family:'IBM Plex Serif',serif;font-size:14px;}
  th{
    text-align:left;font-weight:600;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:6px 8px;border-bottom:1px solid var(--line);
  }
  td{padding:7px 8px;border-bottom:1px solid rgba(201,188,156,0.5);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;}
  .team-cell{display:flex;align-items:center;gap:8px;}
  .avatar{
    width:26px;height:26px;border-radius:4px;object-fit:cover;background:var(--turf);flex-shrink:0;
    border:1px solid rgba(27,42,61,0.15);
  }
  .avatar.sm{width:20px;height:20px;}
  .avatar-fallback{
    width:26px;height:26px;border-radius:4px;background:var(--turf);color:var(--chalk);
    display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;
    font-weight:700;font-size:11px;flex-shrink:0;
  }
  .rank-badge{
    display:inline-block;width:20px;text-align:center;font-family:'Big Shoulders Display',sans-serif;
    font-weight:700;color:var(--amber-dim);
  }

  /* ---------- Trophy case ---------- */
  .trophy-strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;}
  .trophy-plate{
    min-width:150px;background:var(--turf);color:var(--chalk);border-radius:4px;padding:12px 14px;
    border:1px solid rgba(0,0,0,0.2);position:relative;flex-shrink:0;
  }
  .trophy-plate .year{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--amber);
    text-transform:uppercase;
  }
  .trophy-plate .champ{
    font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:16px;margin-top:4px;line-height:1.15;
  }
  .trophy-plate .note{font-size:10.5px;color:#C9D6CC;margin-top:6px;font-family:'IBM Plex Mono',monospace;}
  .trophy-plate.shame-plate{background:var(--oxblood);}
  .trophy-plate.shame-plate .year{color:#F0B8B0;}
  .trophy-plate.shame-plate .note{color:#EBD2CE;}

  /* ---------- Head to head grid ---------- */
  .h2h-scroll{overflow-x:auto;}
  table.h2h{font-size:11px;}
  table.h2h th, table.h2h td{padding:5px 6px;text-align:center;white-space:nowrap;}
  table.h2h th.rowlabel, table.h2h td.rowlabel{text-align:left;position:sticky;left:0;background:var(--cream);}
  .stamp{
    display:inline-block;min-width:52px;padding:3px 4px;border-radius:3px;font-family:'IBM Plex Mono',monospace;
    font-weight:600;letter-spacing:.02em;
  }
  .stamp.win-heavy{background:rgba(47,78,61,0.18);color:#254536;}
  .stamp.loss-heavy{background:rgba(140,51,49,0.16);color:#7A2C2A;}
  .stamp.even{background:rgba(74,85,104,0.1);color:var(--ink-soft);}
  .stamp.blank{color:#B7AC90;}
  .diag{background:repeating-linear-gradient(45deg, rgba(27,42,61,0.06) 0 4px, transparent 4px 8px);}

  /* ---------- Records ---------- */
  .record-list{list-style:none;margin:0;padding:0;}
  .record-list li{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:8px 0;border-bottom:1px solid rgba(201,188,156,0.5);font-size:13.5px;
  }
  .record-list li:last-child{border-bottom:none;}
  .record-list .who{display:flex;align-items:center;gap:8px;}
  .record-list .amt{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--turf);}
  .record-hero{
    font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px;color:var(--ink);
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:700px){.grid-2{grid-template-columns:1fr;}}
  @media (max-width:700px){.wrap{padding-top:20px;padding-bottom:60px;}}

  /* ---------- Season cards ---------- */
  .season-card .season-head{
    display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;
  }
  .season-head .yr{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;color:var(--ink);}
  .season-head .champ-line{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--turf);}

  /* ---------- Team cards ---------- */
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .team-card{
    background:var(--cream-2);border-radius:4px;padding:14px;cursor:pointer;
    border:1px solid rgba(27,42,61,0.08);transition:transform .1s, box-shadow .1s;
  }
  .team-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,0.15);}
  .team-card .thead{display:flex;align-items:center;gap:10px;}
  .team-card .tname{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;line-height:1.15;}
  .team-card .trecord{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .team-card .rings{font-size:13px;margin-top:8px;color:var(--amber-dim);}
  .team-detail{grid-column:1/-1;}

  /* ---------- Loading / error ---------- */
  .status-box{
    padding:60px 20px;text-align:center;font-family:'IBM Plex Mono',monospace;color:#9FB0A6;
  }
  .status-box .spinner{
    width:26px;height:26px;border:3px solid rgba(232,163,61,0.25);border-top-color:var(--amber);
    border-radius:50%;margin:0 auto 16px;animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .status-box.error{color:var(--oxblood-light);}
  .retry-btn{
    margin-top:14px;font-family:'IBM Plex Mono',monospace;background:var(--amber);color:#231405;
    border:none;padding:9px 18px;border-radius:3px;cursor:pointer;font-size:12px;letter-spacing:.05em;
  }
  footer.credit{text-align:center;color:#6E7E76;font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-top:28px;}

  /* ---------- Awards / shame cards ---------- */
  .award-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .award-card{background:var(--cream-2);border-radius:4px;padding:16px;border:1px solid rgba(27,42,61,0.08);}
  .award-card .award-name{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-dim);
  }
  .award-card .award-winner{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .award-card .award-winner .tname{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:16px;}
  .award-card .award-stat{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .award-card .award-desc{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.4;}

  .shame-list{list-style:none;margin:0;padding:0;}
  .shame-list li{
    padding:12px 0;border-bottom:1px solid rgba(201,188,156,0.5);
  }
  .shame-list li:last-child{border-bottom:none;}
  .shame-headline{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;color:var(--oxblood);}
  .shame-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}

  .keeper-badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.05em;
    background:var(--amber);color:#231405;border-radius:2px;padding:1px 5px;margin-left:6px;vertical-align:middle;
  }

  .select-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .select-row select{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:var(--chalk);color:var(--ink);
    border:1px solid var(--line);border-radius:3px;padding:7px 9px;
  }
  .select-row .vs{font-family:'Big Shoulders Display',sans-serif;font-weight:700;color:var(--ink-soft);}

  .subhead{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);margin:18px 0 8px;
  }
  .pill{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:10px;
    background:rgba(47,78,61,0.14);color:#254536;
  }
  .pill.bad{background:rgba(140,51,49,0.14);color:#7A2C2A;}

  /* ---------- Career profile: stat cards ---------- */
  .profile-header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .profile-header .avatar-xl{width:64px;height:64px;border-radius:8px;object-fit:cover;border:2px solid var(--turf);}
  .profile-header .avatar-xl-fallback{
    width:64px;height:64px;border-radius:8px;background:var(--turf);color:var(--chalk);
    display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;
    font-weight:700;font-size:26px;
  }
  .profile-header .pname{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;color:var(--ink);}
  .profile-header .psub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .profile-header .psub .champ-badge{color:var(--amber-dim);font-weight:600;}
  .profile-controls{margin-left:auto;display:flex;align-items:center;gap:10px;}

  .stat-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--cream-2);border-radius:5px;padding:13px 14px;border:1px solid rgba(27,42,61,0.08);}
  .stat-card .sc-label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .stat-card .sc-value{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;color:var(--ink);margin-top:4px;line-height:1;}
  .stat-card .sc-sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
  .sc-bar{height:5px;border-radius:3px;background:rgba(27,42,61,0.1);margin-top:8px;overflow:hidden;}
  .sc-bar-fill{height:100%;background:var(--amber);border-radius:3px;}

  /* ---------- Trend chart ---------- */
  .trend-chart-wrap{overflow-x:auto;}
  .trend-legend{display:flex;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:8px;}
  .trend-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

  /* ---------- Head-to-head summary cards ---------- */
  .h2h-summary-list{list-style:none;margin:0;padding:0;}
  .h2h-summary-list li{
    display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(201,188,156,0.5);
    cursor:pointer;
  }
  .h2h-summary-list li:last-child{border-bottom:none;}
  .h2h-summary-list li:hover{background:rgba(47,78,61,0.05);}
  .h2h-summary-list .hs-name{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:14px;}
  .h2h-summary-list .hs-record-sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
  .h2h-summary-list .hs-right{margin-left:auto;text-align:right;}
  .h2h-summary-list .hs-margin{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:3px;}

  /* ---------- Milestone strip ---------- */
  .milestone-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .milestone-card{background:var(--cream-2);border-radius:5px;padding:12px 14px;border:1px solid rgba(27,42,61,0.08);}
  .milestone-card .mc-label{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-dim);
  }
  .milestone-card .mc-value{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:19px;color:var(--ink);margin-top:4px;}
  .milestone-card .mc-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);margin-top:3px;}

  /* ---------- Draft board grid ---------- */
  table.draft-board{font-size:11.5px;}
  table.draft-board th{text-align:center;white-space:nowrap;}
  table.draft-board .round-label{
    font-family:'Big Shoulders Display',sans-serif;font-weight:700;color:var(--ink-soft);
    background:var(--cream-2);white-space:nowrap;
  }
  td.draft-cell{
    min-width:110px;vertical-align:top;padding:6px 8px;border:1px solid rgba(201,188,156,0.4);
    background:var(--chalk);
  }
  td.draft-cell.empty{color:#B7AC90;text-align:center;background:transparent;}
  .draft-pick-player{font-weight:600;font-size:11.5px;line-height:1.25;}
  .draft-pick-pts{font-family:'IBM Plex Mono',monospace;font-size:10px;margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead" id="masthead">
    <div class="masthead-text">
      <p class="eyebrow">Est. loading&hellip;</p>
      <h1 id="league-name">League Ledger</h1>
      <p class="sub" id="league-sub">Pulling records from Sleeper</p>
    </div>
  </header>

  <nav class="tabs" id="tabs" style="display:none;">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="seasons">Seasons</button>
    <button class="tab-btn" data-tab="h2h">Head&#8209;to&#8209;Head</button>
    <button class="tab-btn" data-tab="records">Records</button>
    <button class="tab-btn" data-tab="trends">Trends</button>
    <button class="tab-btn" data-tab="draft">Draft</button>
    <button class="tab-btn" data-tab="transactions">Transactions</button>
    <button class="tab-btn" data-tab="awards">Awards</button>
    <button class="tab-btn" data-tab="shame">Hall of Shame</button>
    <button class="tab-btn" data-tab="teams">Teams</button>
  </nav>

  <div class="page"><div class="page-inner" id="content">
    <div class="status-box">
      <div class="spinner"></div>
      <div id="status-text">Opening the ledger&hellip;</div>
    </div>
  </div></div>
  <footer class="credit">Data via Sleeper API &middot; refreshed live on load</footer>
</div>

<script>
const LEAGUE_ID = '1384692281021300736';
const AVATAR = (id) => `https://sleepercdn.com/avatars/thumbs/${id}`;

let SEASONS = [];         // per-season raw+derived data, chronological
let TEAMS = new Map();     // ownerKey -> {ownerKey, name, avatar, seasons:[]}
let GAME_ENTRIES = [];     // one entry per team-perspective per game
let H2H = new Map();       // ownerKey -> Map(oppKey -> {w,l,t,pf,pa})
let PLAYERS = new Map();   // player_id -> {name, position, team}
let POWER_RANKINGS = new Map(); // year -> [ {week, ranked:[{ownerKey,score,rank}]} ]
let LUCK = new Map();      // ownerKey -> Map(year -> {actualWins, expectedWins})
let BENCH_TAX = new Map(); // ownerKey -> Map(year -> bench points left unused that season)
let TX_STATS = new Map();  // ownerKey -> Map(year -> {trades, waiverAdds, faAdds})
let TRANSACTIONS_LOG = new Map(); // year -> [ {type, week, sides / ownerKey+added+dropped} ]
let DRAFTS = new Map();    // year -> [ {ownerKey, round, pickNo, draftSlot, playerId, isKeeper, seasonPoints} ]
let PLAYOFF_TEAMS = new Map(); // year -> Set(ownerKey) of teams that made the playoffs
let CHAMP_GAMES = [];      // [{year, champKey, champPts, runnerKey, runnerPts}]
let BENCH_BLUNDERS = [];   // [{ownerKey, year, week, benchPlayerId, benchPts, starterPlayerId, starterPts, delta}]
let ALL_PLAY = new Map();  // ownerKey -> Map(year -> {w,l,t}) — literal record if you'd played every team every week
let COACHING_EFF = new Map(); // ownerKey -> Map(year -> {actualPts, optimalPts})
let EFFICIENCY_WEEKS = []; // [{ownerKey, year, week, actualPts, optimalPts, pct}] — for record-book entries
let PENDING_RIVALRY = null; // {a, b} — set when jumping from a team page to the H2H tab
let PLAYER_WEEKLY_STARTS = []; // [{ownerKey, year, week, isPlayoff, playerId, position, pts}] — every started player, every week

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setStatus(msg){ const el = document.getElementById('status-text'); if(el) el.textContent = msg; }

function fmtPts(whole, decimal){
  return (Number(whole||0) + Number(decimal||0)/100);
}
function pct(w,l,t){
  const games = w+l+t;
  if(!games) return 0;
  return (w + t*0.5) / games;
}
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
function fmt3(n){ return n.toFixed(3).replace(/^0/, ''); }

function avatarImg(url, size){
  return url ? `<img class="avatar${size==='sm'?' sm':''}" src="${url}" alt="">` : '';
}
function fallbackAvatar(name){
  const initial = (name||'?').trim().charAt(0).toUpperCase();
  return `<div class="avatar-fallback">${escapeHtml(initial)}</div>`;
}
function teamAvatarHtml(team, size){
  return team.avatar ? avatarImg(team.avatar, size) : fallbackAvatar(team.name);
}

// -------------------- DATA LOADING --------------------
// This site reads from a local league-data.json file (produced by running
// fetch_data.go) instead of calling the Sleeper API directly. That avoids
// cross-origin fetch restrictions entirely and means the page loads instantly
// with no live network dependency.

async function loadAll(){
  setStatus('Reading league-data.json\u2026');
  let payload;
  try{
    const res = await fetch('./league-data.json', { cache: 'no-store' });
    if(!res.ok) throw new Error(`league-data.json responded with ${res.status}`);
    payload = await res.json();
  } catch(err){
    throw new Error(
      "Couldn't load league-data.json. Make sure it's in the same folder as this HTML file, " +
      "run fetch_data.go if you haven't yet, and open this page through a local server " +
      "(e.g. `python3 -m http.server`) rather than double-clicking the file. See README.md."
    );
  }

  const bundles = payload.bundles || [];
  if(bundles.length === 0) throw new Error('league-data.json has no seasons in it yet.');

  // Only keep seasons that actually have at least one completed week of matchups
  const usable = bundles.filter(b => b.weeks.some(wk => Array.isArray(wk) && wk.length > 0));
  usable.sort((a,b) => Number(a.league.season) - Number(b.league.season));
  return { bundles: usable, playersById: payload.playersById || {} };
}

// -------------------- DATA PROCESSING --------------------

function ownerKeyFor(ownerId, rosterId){
  return ownerId ? `u_${ownerId}` : `orphan_${rosterId}`;
}

// Which real positions can fill each kind of lineup slot. Sleeper's
// standard flex codes are covered; anything unrecognized (e.g. IDP slots)
// is skipped rather than guessed at, so optimal-points calcs stay honest
// about leagues that use exotic slot types.
const SLOT_ELIGIBILITY = {
  QB: ['QB'], RB: ['RB'], WR: ['WR'], TE: ['TE'], K: ['K'],
  DEF: ['DEF'], DST: ['DEF'],
  FLEX: ['RB','WR','TE'],
  SUPER_FLEX: ['QB','RB','WR','TE'],
  WRRB_FLEX: ['WR','RB'],
  REC_FLEX: ['WR','TE'],
  WR_TE_FLEX: ['WR','TE'],
};

// Greedy-but-optimal lineup solver: process the most restrictive slots
// (fewest eligible positions) first, assigning each the highest-scoring
// still-available eligible player, then move to broader flex slots. Because
// every flex category here is a strict superset of the stricter categories
// (a laminar structure), filling narrow-to-broad is provably optimal for
// this assignment — the same principle daily-fantasy "optimal lineup" tools
// rely on. Unrecognized slot codes (BN, IR, TAXI, IDP positions) are simply
// skipped, so this only ever under-counts in exotic-roster edge cases,
// never over-counts.
function computeOptimalLineup(playersPoints, rosterPositions){
  const startingSlots = (rosterPositions||[]).filter(code => SLOT_ELIGIBILITY[code]);
  if(startingSlots.length === 0) return null; // unknown roster format — don't guess

  const pool = [];
  for(const pid in playersPoints){
    const meta = PLAYERS.get(pid);
    if(meta && meta.position) pool.push({ id: pid, position: meta.position, pts: Number(playersPoints[pid])||0 });
  }

  const slotsSorted = startingSlots.slice().sort((a,b) => SLOT_ELIGIBILITY[a].length - SLOT_ELIGIBILITY[b].length);
  const used = new Set();
  let total = 0;
  for(const slot of slotsSorted){
    const eligible = SLOT_ELIGIBILITY[slot];
    let best = null;
    for(const p of pool){
      if(used.has(p.id) || !eligible.includes(p.position)) continue;
      if(!best || p.pts > best.pts) best = p;
    }
    if(best){ used.add(best.id); total += best.pts; }
  }
  return total;
}

function processSeasons(bundles, playersById){
  SEASONS = [];
  TEAMS = new Map();
  GAME_ENTRIES = [];
  H2H = new Map();
  POWER_RANKINGS = new Map();
  LUCK = new Map();
  BENCH_TAX = new Map();
  TX_STATS = new Map();
  DRAFTS = new Map();
  PLAYOFF_TEAMS = new Map();
  CHAMP_GAMES = [];
  BENCH_BLUNDERS = [];
  ALL_PLAY = new Map();
  COACHING_EFF = new Map();
  EFFICIENCY_WEEKS = [];
  PLAYER_WEEKLY_STARTS = [];

  PLAYERS = new Map();
  for(const id in (playersById || {})){ PLAYERS.set(id, playersById[id]); }
  TRANSACTIONS_LOG = new Map();

  for(const bundle of bundles){
    const { league, users, rosters, winnersBracket, losersBracket, weeks, transactions, draftPicks } = bundle;
    const seasonYear = Number(league.season);
    const userById = new Map(users.map(u => [u.user_id, u]));
    const rosterIdToOwnerKey = new Map();

    const standings = [];
    for(const roster of rosters){
      const ownerKey = ownerKeyFor(roster.owner_id, roster.roster_id);
      rosterIdToOwnerKey.set(roster.roster_id, ownerKey);
      const user = roster.owner_id ? userById.get(roster.owner_id) : null;
      const teamName = (user && user.display_name) || (user && (user.metadata && user.metadata.team_name)) || `Team ${roster.roster_id}`;
      const avatar = (user && user.metadata && user.metadata.avatar) ? user.metadata.avatar
                    : (user && user.avatar) ? AVATAR(user.avatar) : null;

      if(!TEAMS.has(ownerKey)){
        TEAMS.set(ownerKey, { ownerKey, name: teamName, avatar, seasons: [] });
      }
      // latest season's naming wins (we process chronologically)
      const teamRecord = TEAMS.get(ownerKey);
      teamRecord.name = teamName;
      teamRecord.avatar = avatar;

      const s = roster.settings || {};
      standings.push({
        ownerKey, rosterId: roster.roster_id, teamName,
        wins: s.wins||0, losses: s.losses||0, ties: s.ties||0,
        pf: fmtPts(s.fpts, s.fpts_decimal),
        pa: fmtPts(s.fpts_against, s.fpts_against_decimal)
      });
    }

    // Championship / runner-up from winners bracket
    let championKey = null, runnerUpKey = null, thirdKey = null;
    const finalGame = winnersBracket.find(g => g.p === 1);
    if(finalGame){
      if(finalGame.w != null) championKey = rosterIdToOwnerKey.get(finalGame.w) || null;
      if(finalGame.l != null) runnerUpKey = rosterIdToOwnerKey.get(finalGame.l) || null;
    }
    const thirdGame = winnersBracket.find(g => g.p === 3);
    if(thirdGame && thirdGame.w != null) thirdKey = rosterIdToOwnerKey.get(thirdGame.w) || null;

    // "Toilet Bowl" / last-place, from the losers bracket. Unlike the
    // winners bracket (where p:1 is the highest-stakes, best-placement
    // game), a losers/placement bracket's p:1 game decides the better pair
    // of finishes among teams who won their way there, while a p:3 "3rd
    // place" style game — between teams who already lost once — decides
    // the truly worst placements. So the game that actually determines
    // dead last is whichever placement game has the *highest* p value on
    // record that season, and it's that game's LOSER who finishes last
    // (its winner finishes second-to-last).
    let loserKey = null, secondLoserKey = null;
    const lb = losersBracket || [];
    const placementGames = lb.filter(g => g.p != null);
    if(placementGames.length){
      const finalLoserGame = placementGames.reduce((m,g) => g.p > m.p ? g : m);
      if(finalLoserGame.l != null) loserKey = rosterIdToOwnerKey.get(finalLoserGame.l) || null;
      if(finalLoserGame.w != null) secondLoserKey = rosterIdToOwnerKey.get(finalLoserGame.w) || null;
    }

    // Playoff participants: any roster that shows up directly as t1/t2 in the
    // bracket (first-round seeds). Used for the "missed the playoffs by a
    // hair" Hall of Shame entry.
    const playoffOwnerKeys = new Set();
    for(const g of winnersBracket){
      if(typeof g.t1 === 'number'){ const k = rosterIdToOwnerKey.get(g.t1); if(k) playoffOwnerKeys.add(k); }
      if(typeof g.t2 === 'number'){ const k = rosterIdToOwnerKey.get(g.t2); if(k) playoffOwnerKeys.add(k); }
    }
    if(playoffOwnerKeys.size > 0) PLAYOFF_TEAMS.set(seasonYear, playoffOwnerKeys);

    const playoffStart = (league.settings && league.settings.playoff_week_start) || 15;
    const rosterPositions = league.roster_positions || [];

    // Per-season running totals used for power rankings / luck ratings / bench tax
    const cumWins = new Map(), cumTies = new Map(), cumPF = new Map();
    const seasonExpectedWins = new Map();
    const seasonBenchTax = new Map();
    const seasonAllPlay = new Map();
    const seasonCoachEff = new Map();
    const playerSeasonPoints = new Map();
    for(const key of rosterIdToOwnerKey.values()){
      cumWins.set(key,0); cumTies.set(key,0); cumPF.set(key,0); seasonExpectedWins.set(key,0);
      seasonBenchTax.set(key,0); seasonAllPlay.set(key,{w:0,l:0,t:0}); seasonCoachEff.set(key,{actualPts:0,optimalPts:0});
    }
    const seasonPowerWeeks = [];

    weeks.forEach((weekArr, idx) => {
      const week = idx + 1;
      if(!Array.isArray(weekArr) || weekArr.length === 0) return;
      const isPlayoff = week >= playoffStart;

      // ---- Pairing pass: head-to-head game log ----
      const groups = new Map();
      for(const entry of weekArr){
        if(entry.matchup_id == null) continue;
        if(!groups.has(entry.matchup_id)) groups.set(entry.matchup_id, []);
        groups.get(entry.matchup_id).push(entry);
      }
      for(const group of groups.values()){
        if(group.length !== 2) continue; // skip byes / median pseudo-groups
        const [a, b] = group;
        const keyA = rosterIdToOwnerKey.get(a.roster_id);
        const keyB = rosterIdToOwnerKey.get(b.roster_id);
        if(!keyA || !keyB) continue;
        const pfA = Number(a.points||0), pfB = Number(b.points||0);

        pushGameEntry(keyA, keyB, pfA, pfB, seasonYear, week, isPlayoff);
        pushGameEntry(keyB, keyA, pfB, pfA, seasonYear, week, isPlayoff);
        updateH2H(keyA, keyB, pfA, pfB);
        updateH2H(keyB, keyA, pfB, pfA);

        if(!isPlayoff){
          if(pfA > pfB) cumWins.set(keyA, cumWins.get(keyA)+1);
          else if(pfA < pfB) cumWins.set(keyB, cumWins.get(keyB)+1);
          else { cumTies.set(keyA, cumTies.get(keyA)+1); cumTies.set(keyB, cumTies.get(keyB)+1); }
        }
      }

      // ---- Per-roster pass: bench points, player season totals, weekly scores ----
      const weekAllPoints = [];
      for(const entry of weekArr){
        const ownerKey = rosterIdToOwnerKey.get(entry.roster_id);
        if(!ownerKey) continue;
        const pf = Number(entry.points||0);
        weekAllPoints.push({ ownerKey, pf });
        if(!isPlayoff) cumPF.set(ownerKey, (cumPF.get(ownerKey)||0) + pf);

        const startersSet = new Set((entry.starters||[]).filter(id => id && id !== '0'));
        const playersPoints = entry.players_points || {};
        let benchPts = 0;
        const benchList = [];
        const starterList = [];
        for(const pid in playersPoints){
          const pts = Number(playersPoints[pid])||0;
          playerSeasonPoints.set(pid, (playerSeasonPoints.get(pid)||0) + pts);
          if(startersSet.has(pid)) starterList.push({ id: pid, pts });
          else { benchPts += pts; benchList.push({ id: pid, pts }); }
        }
        for(const s of starterList){
          const meta = PLAYERS.get(s.id);
          if(meta && meta.position){
            PLAYER_WEEKLY_STARTS.push({ ownerKey, year: seasonYear, week, isPlayoff, playerId: s.id, position: meta.position, pts: s.pts });
          }
        }
        seasonBenchTax.set(ownerKey, (seasonBenchTax.get(ownerKey)||0) + benchPts);

        const optimalPts = computeOptimalLineup(playersPoints, rosterPositions);
        if(optimalPts != null){
          const actualPts = starterList.reduce((s,c) => s+c.pts, 0);
          const rec = seasonCoachEff.get(ownerKey);
          rec.actualPts += actualPts; rec.optimalPts += optimalPts;
          EFFICIENCY_WEEKS.push({
            ownerKey, year: seasonYear, week, actualPts, optimalPts,
            pct: optimalPts > 0 ? (actualPts/optimalPts)*100 : 100
          });
        }

        if(starterList.length && benchList.length){
          const minStarter = starterList.reduce((m,c) => c.pts < m.pts ? c : m);
          const maxBench = benchList.reduce((m,c) => c.pts > m.pts ? c : m);
          if(maxBench.pts > minStarter.pts){
            BENCH_BLUNDERS.push({
              ownerKey, year: seasonYear, week,
              benchPlayerId: maxBench.id, benchPts: maxBench.pts,
              starterPlayerId: minStarter.id, starterPts: minStarter.pts,
              delta: maxBench.pts - minStarter.pts
            });
          }
        }
      }

      // ---- Luck: expected wins & literal all-play record from where this
      // week's score would rank against the whole league ----
      if(!isPlayoff && weekAllPoints.length > 1){
        const n = weekAllPoints.length;
        for(const { ownerKey, pf } of weekAllPoints){
          let beaten = 0;
          const allPlay = seasonAllPlay.get(ownerKey);
          for(const other of weekAllPoints){
            if(other.ownerKey === ownerKey) continue;
            if(pf > other.pf){ beaten += 1; allPlay.w += 1; }
            else if(pf === other.pf){ beaten += 0.5; allPlay.t += 1; }
            else { allPlay.l += 1; }
          }
          seasonExpectedWins.set(ownerKey, (seasonExpectedWins.get(ownerKey)||0) + beaten/(n-1));
        }
      }

      // ---- Power ranking snapshot for this week ----
      if(!isPlayoff && weekAllPoints.length > 0){
        const keysThisWeek = Array.from(new Set(weekAllPoints.map(e => e.ownerKey)));
        const avgCumPF = keysThisWeek.reduce((sum,k) => sum + (cumPF.get(k)||0), 0) / keysThisWeek.length || 1;
        const ranked = keysThisWeek.map(k => {
          const score = 2*(cumWins.get(k)||0) + 1*(cumTies.get(k)||0) + ((cumPF.get(k)||0) / (avgCumPF||1));
          return { ownerKey: k, score };
        }).sort((a,b) => b.score - a.score);
        ranked.forEach((r,i) => r.rank = i+1);
        seasonPowerWeeks.push({ week, ranked });
      }
    });

    POWER_RANKINGS.set(seasonYear, seasonPowerWeeks);

    // Store this season's luck and bench-tax numbers, keyed by year (career
    // totals are computed on demand by summing across years — see luckFor()
    // and benchTaxFor() below).
    for(const ownerKey of rosterIdToOwnerKey.values()){
      const actualWins = GAME_ENTRIES.filter(g => g.teamKey === ownerKey && g.season === seasonYear && !g.isPlayoff && g.pf > g.pa).length;
      if(!LUCK.has(ownerKey)) LUCK.set(ownerKey, new Map());
      LUCK.get(ownerKey).set(seasonYear, { actualWins, expectedWins: seasonExpectedWins.get(ownerKey)||0 });

      if(!BENCH_TAX.has(ownerKey)) BENCH_TAX.set(ownerKey, new Map());
      BENCH_TAX.get(ownerKey).set(seasonYear, seasonBenchTax.get(ownerKey)||0);

      if(!ALL_PLAY.has(ownerKey)) ALL_PLAY.set(ownerKey, new Map());
      ALL_PLAY.get(ownerKey).set(seasonYear, seasonAllPlay.get(ownerKey) || {w:0,l:0,t:0});

      if(!COACHING_EFF.has(ownerKey)) COACHING_EFF.set(ownerKey, new Map());
      COACHING_EFF.get(ownerKey).set(seasonYear, seasonCoachEff.get(ownerKey) || {actualPts:0,optimalPts:0});
    }

    // Championship game score, for Hall of Shame "letdown" entries
    if(championKey && runnerUpKey){
      const champGame = GAME_ENTRIES
        .filter(g => g.season === seasonYear && g.isPlayoff && g.teamKey === runnerUpKey && g.oppKey === championKey)
        .sort((a,b) => b.week - a.week)[0];
      if(champGame){
        CHAMP_GAMES.push({ year: seasonYear, champKey: championKey, champPts: champGame.pa, runnerKey: runnerUpKey, runnerPts: champGame.pf });
      }
    }

    // Transactions: trades, waiver adds, free-agent adds per team, plus a
    // human-readable log of each individual transaction for the Transactions tab.
    const seasonLog = [];
    transactions.forEach((weekTx, txIdx) => {
      if(!Array.isArray(weekTx)) return;
      const week = txIdx + 1;
      for(const tx of weekTx){
        if(tx.status !== 'complete') continue;
        if(tx.type === 'trade'){
          for(const rid of (tx.roster_ids||[])){
            const ok = rosterIdToOwnerKey.get(rid);
            if(ok) bumpTx(ok, 'trades', seasonYear);
          }
          const sides = describeTrade(tx, rosterIdToOwnerKey);
          if(sides.length) seasonLog.push({ type:'trade', week, sides });
        } else if(tx.type === 'waiver' || tx.type === 'free_agent'){
          const field = tx.type === 'waiver' ? 'waiverAdds' : 'faAdds';
          const byRoster = new Map();
          for(const pid in (tx.adds||{})){
            const rid = tx.adds[pid];
            const ok = rosterIdToOwnerKey.get(rid);
            if(ok){
              bumpTx(ok, field, seasonYear);
              if(!byRoster.has(ok)) byRoster.set(ok, { ownerKey: ok, added: [], dropped: [] });
              byRoster.get(ok).added.push(pid);
            }
          }
          for(const pid in (tx.drops||{})){
            const rid = tx.drops[pid];
            const ok = rosterIdToOwnerKey.get(rid);
            if(ok){
              if(!byRoster.has(ok)) byRoster.set(ok, { ownerKey: ok, added: [], dropped: [] });
              byRoster.get(ok).dropped.push(pid);
            }
          }
          for(const entry of byRoster.values()){
            seasonLog.push({ type: tx.type, week, ownerKey: entry.ownerKey, added: entry.added, dropped: entry.dropped, faabSpent: tx.settings && tx.settings.waiver_bid });
          }
        }
      }
    });
    if(seasonLog.length) TRANSACTIONS_LOG.set(seasonYear, seasonLog);

    // Draft picks, graded by how many fantasy points that player produced this season
    const seasonDraft = [];
    for(const pick of (draftPicks||[])){
      const ownerKey = rosterIdToOwnerKey.get(pick.roster_id);
      if(!ownerKey) continue;
      seasonDraft.push({
        ownerKey, round: pick.round, pickNo: pick.pick_no, draftSlot: pick.draft_slot || null,
        playerId: pick.player_id, isKeeper: !!pick.is_keeper,
        seasonPoints: playerSeasonPoints.get(pick.player_id) || 0
      });
    }
    if(seasonDraft.length) DRAFTS.set(seasonYear, seasonDraft.sort((a,b) => (a.round-b.round) || (a.pickNo-b.pickNo)));

    SEASONS.push({
      year: seasonYear,
      leagueId: league.league_id,
      name: league.name,
      avatar: league.avatar ? AVATAR(league.avatar) : null,
      standings,
      championKey, runnerUpKey, thirdKey, loserKey, secondLoserKey
    });

    for(const s of standings){
      TEAMS.get(s.ownerKey).seasons.push({ year: seasonYear, ...s });
    }
  }

  BENCH_BLUNDERS.sort((a,b) => b.delta - a.delta);
}

function pushGameEntry(teamKey, oppKey, pf, pa, season, week, isPlayoff){
  GAME_ENTRIES.push({ teamKey, oppKey, pf, pa, margin: pf - pa, season, week, isPlayoff, sortKey: season*100+week });
}
function updateH2H(teamKey, oppKey, pf, pa){
  if(!H2H.has(teamKey)) H2H.set(teamKey, new Map());
  const m = H2H.get(teamKey);
  if(!m.has(oppKey)) m.set(oppKey, {w:0,l:0,t:0,pf:0,pa:0});
  const rec = m.get(oppKey);
  rec.pf += pf; rec.pa += pa;
  if(pf > pa) rec.w++; else if(pf < pa) rec.l++; else rec.t++;
}
function bumpTx(ownerKey, field, year){
  if(!TX_STATS.has(ownerKey)) TX_STATS.set(ownerKey, new Map());
  const byYear = TX_STATS.get(ownerKey);
  if(!byYear.has(year)) byYear.set(year, { trades:0, waiverAdds:0, faAdds:0 });
  byYear.get(year)[field] += 1;
}
function describeTrade(tx, rosterIdToOwnerKey){
  const sides = new Map(); // rosterId -> {ownerKey, receives:[], sends:[]}
  for(const rid of (tx.roster_ids||[])){
    const ok = rosterIdToOwnerKey.get(rid);
    if(ok) sides.set(rid, { ownerKey: ok, receives: [], sends: [] });
  }
  for(const pid in (tx.adds||{})){
    const rid = tx.adds[pid];
    if(sides.has(rid)) sides.get(rid).receives.push({ type:'player', id:pid });
  }
  for(const pid in (tx.drops||{})){
    const rid = tx.drops[pid];
    if(sides.has(rid)) sides.get(rid).sends.push({ type:'player', id:pid });
  }
  for(const dp of (tx.draft_picks||[])){
    if(dp.owner_id != null && sides.has(dp.owner_id)) sides.get(dp.owner_id).receives.push({ type:'pick', season:dp.season, round:dp.round });
    if(dp.previous_owner_id != null && sides.has(dp.previous_owner_id)) sides.get(dp.previous_owner_id).sends.push({ type:'pick', season:dp.season, round:dp.round });
  }
  return Array.from(sides.values()).filter(s => s.receives.length || s.sends.length);
}
function assetLabel(a){
  return a.type === 'pick' ? `${a.season} round ${a.round} pick` : playerLabel(a.id);
}
function playerLabel(playerId){
  const p = PLAYERS.get(playerId);
  if(!p) return `Player ${playerId}`;
  return `${p.name}${p.position ? ' ('+p.position+(p.team?(' '+p.team):'')+')' : ''}`;
}
function benchTaxFor(ownerKey, year){
  const byYear = BENCH_TAX.get(ownerKey);
  if(!byYear) return 0;
  if(year == null) return Array.from(byYear.values()).reduce((s,v)=>s+v,0);
  return byYear.get(year) || 0;
}
function allPlayFor(ownerKey, year){
  const byYear = ALL_PLAY.get(ownerKey);
  if(!byYear) return { w:0, l:0, t:0 };
  if(year == null){
    let w=0,l=0,t=0;
    for(const v of byYear.values()){ w+=v.w; l+=v.l; t+=v.t; }
    return { w, l, t };
  }
  return byYear.get(year) || { w:0, l:0, t:0 };
}
function coachingEffFor(ownerKey, year){
  const byYear = COACHING_EFF.get(ownerKey);
  if(!byYear) return { actualPts:0, optimalPts:0, pct:null };
  let actualPts=0, optimalPts=0;
  if(year == null){
    for(const v of byYear.values()){ actualPts+=v.actualPts; optimalPts+=v.optimalPts; }
  } else {
    const v = byYear.get(year) || { actualPts:0, optimalPts:0 };
    actualPts = v.actualPts; optimalPts = v.optimalPts;
  }
  return { actualPts, optimalPts, pct: optimalPts > 0 ? (actualPts/optimalPts)*100 : null };
}

// ---- Section 6: Record Book expansions ----

const POSITION_ORDER = ['QB','RB','WR','TE','FLEX','K','DEF','DST'];
function positionRecords(){
  const byPos = new Map();
  for(const s of PLAYER_WEEKLY_STARTS){
    if(!byPos.has(s.position)) byPos.set(s.position, []);
    byPos.get(s.position).push(s);
  }
  const positions = Array.from(byPos.keys()).sort((a,b) => {
    const ia = POSITION_ORDER.indexOf(a), ib = POSITION_ORDER.indexOf(b);
    if(ia === -1 && ib === -1) return a.localeCompare(b);
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });
  return positions.map(pos => {
    const list = byPos.get(pos);
    const highest = list.reduce((m,c) => c.pts > m.pts ? c : m);
    const lowest = list.reduce((m,c) => c.pts < m.pts ? c : m);
    return { position: pos, highest, lowest };
  });
}

const POINT_MILESTONES = [2500, 5000, 7500, 10000, 15000, 20000, 25000];
const WIN_MILESTONES = [10, 25, 50, 75, 100, 150];
function computeMilestones(){
  const pointCrossings = [];
  const winCrossings = [];
  for(const ownerKey of TEAMS.keys()){
    const entries = GAME_ENTRIES.filter(g => g.teamKey === ownerKey).sort((a,b) => a.sortKey - b.sortKey);
    let cumPts = 0, cumWins = 0, pIdx = 0, wIdx = 0;
    for(const g of entries){
      cumPts += g.pf;
      if(g.pf > g.pa) cumWins++;
      while(pIdx < POINT_MILESTONES.length && cumPts >= POINT_MILESTONES[pIdx]){
        pointCrossings.push({ ownerKey, threshold: POINT_MILESTONES[pIdx], year: g.season, week: g.week, sortKey: g.sortKey });
        pIdx++;
      }
      while(wIdx < WIN_MILESTONES.length && cumWins >= WIN_MILESTONES[wIdx]){
        winCrossings.push({ ownerKey, threshold: WIN_MILESTONES[wIdx], year: g.season, week: g.week, sortKey: g.sortKey });
        wIdx++;
      }
    }
  }
  const firstToEach = (crossings, thresholds) => thresholds.map(t => {
    const matches = crossings.filter(c => c.threshold === t);
    if(matches.length === 0) return null;
    return matches.reduce((m,c) => c.sortKey < m.sortKey ? c : m);
  }).filter(Boolean);
  return { points: firstToEach(pointCrossings, POINT_MILESTONES), wins: firstToEach(winCrossings, WIN_MILESTONES) };
}

function bestNonPlayoffTeamEver(){
  let best = null;
  for(const season of SEASONS){
    const playoffSet = PLAYOFF_TEAMS.get(season.year);
    if(!playoffSet) continue;
    for(const s of season.standings){
      if(playoffSet.has(s.ownerKey)) continue;
      const winPct = pct(s.wins, s.losses, s.ties);
      const candidate = { ownerKey: s.ownerKey, year: season.year, wins:s.wins, losses:s.losses, ties:s.ties, pf: s.pf, winPct };
      if(!best || winPct > best.winPct || (winPct === best.winPct && s.pf > best.pf)) best = candidate;
    }
  }
  return best;
}
function luckFor(ownerKey, year){
  const byYear = LUCK.get(ownerKey);
  if(!byYear) return { actualWins:0, expectedWins:0 };
  if(year == null){
    let actualWins=0, expectedWins=0;
    for(const v of byYear.values()){ actualWins+=v.actualWins; expectedWins+=v.expectedWins; }
    return { actualWins, expectedWins };
  }
  return byYear.get(year) || { actualWins:0, expectedWins:0 };
}
function txStatsFor(ownerKey, year){
  const byYear = TX_STATS.get(ownerKey);
  if(!byYear) return { trades:0, waiverAdds:0, faAdds:0 };
  if(year == null){
    let trades=0, waiverAdds=0, faAdds=0;
    for(const v of byYear.values()){ trades+=v.trades; waiverAdds+=v.waiverAdds; faAdds+=v.faAdds; }
    return { trades, waiverAdds, faAdds };
  }
  return byYear.get(year) || { trades:0, waiverAdds:0, faAdds:0 };
}

function careerStats(ownerKey){
  const team = TEAMS.get(ownerKey);
  let wins=0, losses=0, ties=0, pf=0, pa=0, championships=0, runnerUps=0, toiletBowls=0, seasonsPlayed=team.seasons.length;
  for(const s of team.seasons){ wins+=s.wins; losses+=s.losses; ties+=s.ties; pf+=s.pf; pa+=s.pa; }
  for(const season of SEASONS){
    if(season.championKey === ownerKey) championships++;
    if(season.runnerUpKey === ownerKey) runnerUps++;
    if(season.loserKey === ownerKey) toiletBowls++;
  }
  return { wins, losses, ties, pf, pa, championships, runnerUps, toiletBowls, seasonsPlayed, winPct: pct(wins,losses,ties) };
}

function computeStreaks(ownerKey){
  const entries = GAME_ENTRIES.filter(g => g.teamKey === ownerKey).sort((a,b)=>a.sortKey-b.sortKey);
  let curW=0, curL=0, maxW=0, maxL=0;
  let curWStart=null, curLStart=null, maxWCtx=null, maxLCtx=null;
  for(const g of entries){
    if(g.pf > g.pa){
      if(curW === 0) curWStart = g;
      curW++; curL=0; curLStart=null;
      if(curW > maxW){ maxW = curW; maxWCtx = { start: curWStart, end: g }; }
    } else if(g.pf < g.pa){
      if(curL === 0) curLStart = g;
      curL++; curW=0; curWStart=null;
      if(curL > maxL){ maxL = curL; maxLCtx = { start: curLStart, end: g }; }
    } else { curW=0; curL=0; curWStart=null; curLStart=null; }
  }
  return { maxW, maxL, maxWCtx, maxLCtx };
}

function seasonsForTeam(ownerKey){
  const team = TEAMS.get(ownerKey);
  return team.seasons.slice().sort((a,b) => a.year-b.year).map(s => {
    const totalGames = s.wins + s.losses + s.ties;
    const luck = luckFor(ownerKey, s.year);
    return {
      year: s.year, pf: s.pf, pa: s.pa, wins: s.wins, losses: s.losses, ties: s.ties,
      winPct: pct(s.wins, s.losses, s.ties),
      expectedWinPct: totalGames ? luck.expectedWins/totalGames : null
    };
  });
}

function playoffRateFor(ownerKey){
  const team = TEAMS.get(ownerKey);
  const totalSeasons = team.seasons.length;
  let appearances = 0;
  for(const s of team.seasons){
    const set = PLAYOFF_TEAMS.get(s.year);
    if(set && set.has(ownerKey)) appearances++;
  }
  return { appearances, totalSeasons, pct: totalSeasons ? appearances/totalSeasons : 0 };
}

function titlesFor(ownerKey){
  const years = SEASONS.filter(s => s.championKey === ownerKey).map(s => s.year);
  return { count: years.length, years };
}

function toiletBowlsFor(ownerKey){
  const years = SEASONS.filter(s => s.loserKey === ownerKey).map(s => s.year);
  return { count: years.length, years };
}

function bestDraftSlotFor(ownerKey){
  let best = null;
  for(const [year, picks] of DRAFTS.entries()){
    const mine = picks.filter(p => p.ownerKey === ownerKey && p.draftSlot);
    if(mine.length === 0) continue;
    const slot = mine[0].draftSlot;
    if(!best || slot < best.slot) best = { slot, year };
  }
  return best;
}

function highestLowestScoreFor(ownerKey){
  const entries = GAME_ENTRIES.filter(g => g.teamKey === ownerKey);
  if(entries.length === 0) return { highest:null, lowest:null };
  const highest = entries.reduce((m,g) => g.pf > m.pf ? g : m);
  const lowest = entries.reduce((m,g) => g.pf < m.pf ? g : m);
  return { highest, lowest };
}

function efficiencyLabel(pct){
  if(pct == null) return '';
  if(pct >= 92) return 'Elite';
  if(pct >= 85) return 'Above Average';
  if(pct >= 78) return 'Average';
  if(pct >= 70) return 'Below Average';
  return 'Needs Work';
}

function luckLabel(delta){
  if(delta > 0.75) return 'Above Average';
  if(delta < -0.75) return 'Below Average';
  return 'Average';
}

// ---- Section 7: League Milestones Timeline ----

function buildMilestonesTimeline(){
  const events = [];
  for(const s of SEASONS){
    if(s.championKey){
      events.push({ year: s.year, sortKey: s.year*100+99, text: `${escapeHtml(TEAMS.get(s.championKey).name)} wins the ${s.year} championship` });
    }
  }
  const ms = computeMilestones();
  for(const m of ms.points){
    events.push({ year: m.year, sortKey: m.sortKey, text: `${escapeHtml(TEAMS.get(m.ownerKey).name)} becomes the first to ${m.threshold.toLocaleString()} career points (wk${m.week})` });
  }
  for(const m of ms.wins){
    events.push({ year: m.year, sortKey: m.sortKey, text: `${escapeHtml(TEAMS.get(m.ownerKey).name)} becomes the first to ${m.threshold} career wins (wk${m.week})` });
  }
  if(GAME_ENTRIES.length){
    const highest = GAME_ENTRIES.reduce((m,g) => g.pf > m.pf ? g : m);
    events.push({ year: highest.season, sortKey: highest.sortKey, text: `${escapeHtml(TEAMS.get(highest.teamKey).name)} sets the all-time high score: ${fmt1(highest.pf)} (wk${highest.week})` });
    const winnersOnly = GAME_ENTRIES.filter(g => g.margin > 0);
    if(winnersOnly.length){
      const blowout = winnersOnly.reduce((m,g) => g.margin > m.margin ? g : m);
      events.push({ year: blowout.season, sortKey: blowout.sortKey, text: `${escapeHtml(TEAMS.get(blowout.teamKey).name)} pulls off the biggest blowout ever, beating ${escapeHtml(TEAMS.get(blowout.oppKey).name)} by ${fmt1(blowout.margin)} (wk${blowout.week})` });
    }
  }
  events.sort((a,b) => a.sortKey - b.sortKey);
  return events;
}

function renderMilestonesTimeline(){
  const events = buildMilestonesTimeline();
  if(events.length === 0) return `<p class="muted">No milestones recorded yet.</p>`;
  const byYear = new Map();
  for(const e of events){
    if(!byYear.has(e.year)) byYear.set(e.year, []);
    byYear.get(e.year).push(e);
  }
  const years = Array.from(byYear.keys()).sort((a,b) => a-b);
  const blocks = years.map(y => `
    <div class="card" style="margin-bottom:10px;">
      <h3 class="card-title">${y}</h3>

}

// ---- Section 7: Schedule Simulator ----

function weeklyLookup(year){
  const map = new Map();
  for(const g of GAME_ENTRIES){
    if(g.season !== year || g.isPlayoff) continue;
    if(!map.has(g.teamKey)) map.set(g.teamKey, new Map());
    map.get(g.teamKey).set(g.week, g);
  }
  return map;
}

function simulateSchedule(year, teamAKey, teamBKey){
  const lookup = weeklyLookup(year);
  const aGames = lookup.get(teamAKey);
  const bGames = lookup.get(teamBKey);
  if(!aGames || !bGames) return null;
  let w=0, l=0, t=0;
  const weeks = [];
  for(const [week, bGame] of Array.from(bGames.entries()).sort((a,b)=>a[0]-b[0])){
    const aGame = aGames.get(week);
    if(!aGame) continue;
    const aScore = aGame.pf, oppScore = bGame.pa;
    let result;
    if(aScore > oppScore){ w++; result='W'; } else if(aScore < oppScore){ l++; result='L'; } else { t++; result='T'; }
    weeks.push({ week, aScore, oppScore, oppKey: bGame.oppKey, result });
  }
  return { wins:w, losses:l, ties:t, weeks };
}

function renderScheduleSimulatorShell(){
  const years = SEASONS.map(s => s.year).sort((a,b) => b-a);
  if(years.length === 0) return '';
  const yearOptions = years.map(y => `<option value="${y}">${y}</option>`).join('');
  const teamKeys = Array.from(TEAMS.keys()).sort((a,b) => TEAMS.get(a).name.localeCompare(TEAMS.get(b).name));

  return `

      <span class="vs">with the schedule of</span>
      <select id="sim-teamB">${teamOptions}</select>

  `;
}

function pairStreaks(keyA, keyB){
  const games = GAME_ENTRIES.filter(g => g.teamKey === keyA && g.oppKey === keyB).sort((a,b) => a.sortKey - b.sortKey);
  let curSide=null, curLen=0, curStart=null;
  let maxSide=null, maxLen=0, maxCtx=null;
  for(const g of games){
    const side = g.pf > g.pa ? 'A' : g.pf < g.pa ? 'B' : null;
    if(side === null || side !== curSide){ curSide = side; curLen = side ? 1 : 0; curStart = side ? g : null; }
    else { curLen++; }
    if(side && curLen > maxLen){ maxLen = curLen; maxSide = side; maxCtx = { start: curStart, end: g }; }
  }
  let currentSide=null, currentLen=0;
  for(let i=games.length-1; i>=0; i--){
    const g = games[i];
    const side = g.pf > g.pa ? 'A' : g.pf < g.pa ? 'B' : null;
    if(i === games.length-1){ if(side === null) break; currentSide = side; currentLen = 1; }
    else { if(side === currentSide){ currentLen++; } else break; }
  }
  return { longest: { side: maxSide, len: maxLen, ctx: maxCtx }, current: { side: currentSide, len: currentLen } };
}

function renderRivalryLog(keyA, keyB){
  if(keyA === keyB) return `<p class="muted">Pick two different teams to see their history.</p>`;
  const games = GAME_ENTRIES.filter(g => g.teamKey === keyA && g.oppKey === keyB).sort((a,b) => a.sortKey - b.sortKey);
  if(games.length === 0) return `<p class="muted">${escapeHtml(TEAMS.get(keyA).name)} and ${escapeHtml(TEAMS.get(keyB).name)} haven't played each other.</p>`;
  const rec = H2H.get(keyA).get(keyB);
  const nameA = escapeHtml(TEAMS.get(keyA).name), nameB = escapeHtml(TEAMS.get(keyB).name);

  const avgA = games.reduce((s,g) => s+g.pf, 0) / games.length;
  const avgB = games.reduce((s,g) => s+g.pa, 0) / games.length;
  const avgMargin = avgA - avgB;

  const decided = games.filter(g => g.margin !== 0);
  const closest = decided.slice().sort((a,b) => Math.abs(a.margin) - Math.abs(b.margin)).slice(0,3);
  const blowouts = decided.slice().sort((a,b) => Math.abs(b.margin) - Math.abs(a.margin)).slice(0,3);
  const domA = games.filter(g => g.margin >= 20).length;
  const domB = games.filter(g => g.margin <= -20).length;

  const streaks = pairStreaks(keyA, keyB);
  const sideName = side => side === 'A' ? nameA : side === 'B' ? nameB : null;

  const gameLine = (g) => `
    <li>
      <span class="who"><span class="muted">${g.season} wk${g.week}${g.isPlayoff?' (playoffs)':''}</span></span>
      <span class="amt">${fmt1(g.pf)} &ndash; ${fmt1(g.pa)}</span>
    </li>`;

  const rows = games.map(g => `
    <tr>
      <td class="num">${g.season}</td>
      <td class="num">wk${g.week}${g.isPlayoff?' (playoffs)':''}</td>
      <td class="num">${fmt1(g.pf)}</td>
      <td class="num">${fmt1(g.pa)}</td>
      <td>${g.pf > g.pa ? `<span class="pill">${nameA} won</span>` : g.pf < g.pa ? `<span class="pill bad">${nameB} won</span>` : `<span class="pill">Tie</span>`}</td>
    </tr>`).join('');

  return `
    <div class="card">
      <h3 class="card-title">${nameA} vs ${nameB} &mdash; ${rec.w}-${rec.l}${rec.t?('-'+rec.t):''}</h3>

      <div class="stat-card-grid">
        <div class="stat-card">
          <div class="sc-label">Average Score</div>
          <div class="sc-value" style="font-size:19px;">${fmt1(avgA)} &ndash; ${fmt1(avgB)}</div>
          <div class="sc-sub">${nameA} vs ${nameB}</div>
        </div>
        <div class="stat-card">
          <div class="sc-label">Average Margin</div>
          <div class="sc-value" style="font-size:19px;">${avgMargin>=0?'+':''}${fmt1(avgMargin)}</div>
          <div class="sc-sub">${avgMargin>=0?nameA:nameB} on average</div>
        </div>
        <div class="stat-card">
          <div class="sc-label">Current Streak</div>
          <div class="sc-value" style="font-size:19px;">${streaks.current.len > 0 ? streaks.current.len : '&mdash;'}</div>
          <div class="sc-sub">${streaks.current.len > 0 ? sideName(streaks.current.side)+' has won '+streaks.current.len+' straight' : 'No streak in progress'}</div>
        </div>
        <div class="stat-card">
          <div class="sc-label">Longest Streak</div>
          <div class="sc-value" style="font-size:19px;">${streaks.longest.len || '&mdash;'}</div>
          <div class="sc-sub">${streaks.longest.len ? sideName(streaks.longest.side)+' &middot; '+streaks.longest.ctx.start.season+' wk'+streaks.longest.ctx.start.week+'\u2013'+streaks.longest.ctx.end.season+' wk'+streaks.longest.ctx.end.week : 'n/a'}</div>
        </div>
        <div class="stat-card">
          <div class="sc-label">Dominator (won by 20+)</div>
          <div class="sc-value" style="font-size:19px;">${domA} &ndash; ${domB}</div>
          <div class="sc-sub">${nameA} vs ${nameB}</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3 class="card-title">Closest Games</h3>
          <ul class="record-list">${closest.map(gameLine).join('') || '<li class="muted">No decided games yet</li>'}</ul>
        </div>
        <div class="card">
          <h3 class="card-title">Biggest Blowouts</h3>
          <ul class="record-list">${blowouts.map(gameLine).join('') || '<li class="muted">No decided games yet</li>'}</ul>
        </div>
      </div>

      <h3 class="card-title" style="margin-top:16px;">Full Game Log</h3>
      <div style="overflow-x:auto;">
      <table><thead><tr><th class="num">Year</th><th class="num">Week</th><th class="num">PF</th><th class="num">PA</th><th>Result</th></tr></thead>
      <tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

function renderRecords(){
  const winnersOnly = GAME_ENTRIES.filter(g => g.margin > 0);
  const highest = GAME_ENTRIES.slice().sort((a,b)=>b.pf-a.pf).slice(0,5);
  const lowest = GAME_ENTRIES.slice().sort((a,b)=>a.pf-b.pf).slice(0,5);
  const blowouts = winnersOnly.slice().sort((a,b)=>b.margin-a.margin).slice(0,5);
  const closest = winnersOnly.slice().sort((a,b)=>a.margin-b.margin).slice(0,5);

  const gameLine = (g, showMargin) => `
    <li>
      <span class="who">${teamLabel(g.teamKey,'sm')}<span class="muted">vs ${TEAMS.get(g.oppKey)?escapeHtml(TEAMS.get(g.oppKey).name):'Unknown'} &middot; ${g.season}${g.isPlayoff?' playoffs':''} wk${g.week}</span></span>
      <span class="amt">${showMargin ? fmt1(g.margin) : fmt1(g.pf)}</span>
    </li>`;

  const listBlock = (title, items, showMargin) => `
    <div class="card">
      <h3 class="card-title">${title}</h3>
      <ul class="record-list">${items.map(g=>gameLine(g,showMargin)).join('') || '<li class="muted">No data yet</li>'}</ul>
    </div>`;

  // season-level records
  const seasonRows = [];
  for(const team of TEAMS.values()){
    for(const s of team.seasons){
      seasonRows.push({ ownerKey: team.ownerKey, year: s.year, pf: s.pf, pa: s.pa, winPct: pct(s.wins,s.losses,s.ties), record: `${s.wins}-${s.losses}${s.ties?('-'+s.ties):''}` });
    }
  }
  const bestSeasonPts = seasonRows.slice().sort((a,b)=>b.pf-a.pf).slice(0,3);
  const worstSeasonPts = seasonRows.slice().sort((a,b)=>a.pf-b.pf).slice(0,3);
  const bestRecordSeason = seasonRows.slice().sort((a,b)=>b.winPct-a.winPct).slice(0,3);
  const worstRecordSeason = seasonRows.slice().sort((a,b)=>a.winPct-b.winPct).slice(0,3);

  const seasonLine = (r, valueLabel) => `
    <li>
      <span class="who">${teamLabel(r.ownerKey,'sm')}<span class="muted">${r.year} &middot; ${r.record}</span></span>
      <span class="amt">${valueLabel(r)}</span>
    </li>`;

  const seasonBlock = (title, items, valueLabel) => `
    <div class="card">
      <h3 class="card-title">${title}</h3>
      <ul class="record-list">${items.map(r=>seasonLine(r,valueLabel)).join('') || '<li class="muted">No data yet</li>'}</ul>
    </div>`;

  // streaks
  let bestWinStreak = {ownerKey:null, val:0}, bestLossStreak = {ownerKey:null, val:0};
  for(const key of TEAMS.keys()){
    const s = computeStreaks(key);
    if(s.maxW > bestWinStreak.val) bestWinStreak = {ownerKey:key, val:s.maxW};
    if(s.maxL > bestLossStreak.val) bestLossStreak = {ownerKey:key, val:s.maxL};
  }

  const bestManagedWeeks = EFFICIENCY_WEEKS.filter(w => w.optimalPts > 0).slice().sort((a,b) => b.pct-a.pct).slice(0,5);
  const managedLine = (w) => `
    <li>
      <span class="who">${teamLabel(w.ownerKey,'sm')}<span class="muted">${w.year} wk${w.week} &middot; ${fmt1(w.actualPts)} of ${fmt1(w.optimalPts)} possible</span></span>
      <span class="amt">${fmt1(w.pct)}%</span>
    </li>`;

  // bench tax by season instance
  const benchSeasonRows = [];
  for(const [ownerKey, byYear] of BENCH_TAX.entries()){
    for(const [year, val] of byYear.entries()){
      benchSeasonRows.push({ ownerKey, year, val });
    }
  }
  const worstBenchSeasons = benchSeasonRows.slice().sort((a,b) => b.val-a.val).slice(0,5);
  const benchLine = (r) => `
    <li>
      <span class="who">${teamLabel(r.ownerKey,'sm')}<span class="muted">${r.year}</span></span>
      <span class="amt">${fmt1(r.val)} pts</span>
    </li>`;

  // by-position highs and lows
  const posRecords = positionRecords();
  const posRows = posRecords.map(p => `
    <tr>
      <td><strong>${escapeHtml(p.position)}</strong></td>
      <td>${escapeHtml(playerLabel(p.highest.playerId))}</td>
      <td class="num">${fmt1(p.highest.pts)}</td>
      <td>${teamLabel(p.highest.ownerKey,'sm')}<span class="muted"> &middot; ${p.highest.year} wk${p.highest.week}</span></td>
      <td>${escapeHtml(playerLabel(p.lowest.playerId))}</td>
      <td class="num">${fmt1(p.lowest.pts)}</td>
    </tr>`).join('');

  // milestones
  const milestones = computeMilestones();
  const ordinal = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
  const milestoneLine = (m) => `
    <li>
      <span class="who">${teamLabel(m.ownerKey,'sm')}<span class="muted">${m.year} wk${m.week}</span></span>
      <span class="amt">${m.threshold.toLocaleString()}</span>
    </li>`;

  return `
    <h2 class="section-title">The Record Book</h2>
    <div class="grid-2">
      ${listBlock('Highest Single-Game Scores', highest, false)}
      ${listBlock('Lowest Single-Game Scores', lowest, false)}
      ${listBlock('Biggest Blowouts', blowouts, true)}
      ${listBlock('Closest Finishes', closest, true)}
      ${seasonBlock('Most Points, Single Season', bestSeasonPts, r=>fmt1(r.pf))}
      ${seasonBlock('Fewest Points, Single Season', worstSeasonPts, r=>fmt1(r.pf))}
      ${seasonBlock('Best Season Record', bestRecordSeason, r=>fmt3(r.winPct))}
      ${seasonBlock('Worst Season Record', worstRecordSeason, r=>fmt3(r.winPct))}
    </div>
    <div class="grid-2">
      <div class="card">
        <h3 class="card-title">Streaks</h3>
        <ul class="record-list">
          <li><span class="who">${bestWinStreak.ownerKey ? teamLabel(bestWinStreak.ownerKey,'sm') : 'N/A'}<span class="muted">Longest win streak</span></span><span class="amt">${bestWinStreak.val} games</span></li>
          <li><span class="who">${bestLossStreak.ownerKey ? teamLabel(bestLossStreak.ownerKey,'sm') : 'N/A'}<span class="muted">Longest losing streak</span></span><span class="amt">${bestLossStreak.val} games</span></li>
        </ul>
      </div>
      <div class="card">
        <h3 class="card-title">Best-Managed Weeks</h3>
        <ul class="record-list">${bestManagedWeeks.map(managedLine).join('') || '<li class="muted">No data yet</li>'}</ul>
        <p class="muted" style="margin-top:8px;">Closest a lineup came to scoring its own best-possible total that week.</p>
      </div>
    </div>
    <div class="card">
      <h3 class="card-title">Most Points Left on the Bench, Single Season</h3>
      <ul class="record-list">${worstBenchSeasons.map(benchLine).join('') || '<li class="muted">No data yet</li>'}</ul>
    </div>

    ${posRecords.length ? `
    <h2 class="section-title" style="margin-top:26px;">Highest & Lowest by Position</h2>
    <div class="card">
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Pos</th><th>Highest Starter</th><th class="num">Pts</th><th>When</th><th>Lowest Starter</th><th class="num">Pts</th></tr></thead>
        <tbody>${posRows}</tbody>
      </table>
      </div>
      <p class="muted" style="margin-top:8px;">Only counts players who were actually in the starting lineup that week.</p>
    </div>` : ''}

    <h2 class="section-title" style="margin-top:26px;">Milestones</h2>
    <div class="grid-2">
      <div class="card">
        <h3 class="card-title">First to Reach... (Career Points)</h3>
        <ul class="record-list">${milestones.points.map(milestoneLine).join('') || '<li class="muted">No milestones reached yet</li>'}</ul>
      </div>
      <div class="card">
        <h3 class="card-title">First to Reach... (Career Wins)</h3>
        <ul class="record-list">${milestones.wins.map(milestoneLine).join('') || '<li class="muted">No milestones reached yet</li>'}</ul>
      </div>
    </div>

    <h2 class="section-title" style="margin-top:26px;">Postseason Only</h2>
    ${renderPostseasonBlock()}
  `;
}

function renderPostseasonBlock(){
  const playoffGames = GAME_ENTRIES.filter(g => g.isPlayoff);
  if(playoffGames.length === 0) return `<p class="muted">No playoff data recorded yet.</p>`;

  const highest = playoffGames.slice().sort((a,b)=>b.pf-a.pf).slice(0,5);
  const lowest = playoffGames.slice().sort((a,b)=>a.pf-b.pf).slice(0,5);

  const gameLine = (g) => `
    <li>
      <span class="who">${teamLabel(g.teamKey,'sm')}<span class="muted">vs ${TEAMS.get(g.oppKey)?escapeHtml(TEAMS.get(g.oppKey).name):'Unknown'} &middot; ${g.season} wk${g.week}</span></span>
      <span class="amt">${fmt1(g.pf)}</span>
    </li>`;

  const byTeam = new Map();
  for(const g of playoffGames){
    if(!byTeam.has(g.teamKey)) byTeam.set(g.teamKey, { w:0, l:0, t:0 });
    const r = byTeam.get(g.teamKey);
    if(g.pf > g.pa) r.w++; else if(g.pf < g.pa) r.l++; else r.t++;
  }
  const teamRows = Array.from(byTeam.entries())
    .map(([k,r]) => ({ ownerKey:k, ...r, pct: pct(r.w,r.l,r.t) }))
    .sort((a,b) => b.pct - a.pct)
    .map(r => `<tr><td>${teamLabel(r.ownerKey,'sm')}</td><td class="num">${r.w}-${r.l}${r.t?('-'+r.t):''}</td><td class="num">${fmt3(r.pct)}</td></tr>`).join('');

  return `
    <div class="grid-2">
      <div class="card"><h3 class="card-title">Highest Playoff Scores</h3><ul class="record-list">${highest.map(gameLine).join('')}</ul></div>
      <div class="card"><h3 class="card-title">Lowest Playoff Scores</h3><ul class="record-list">${lowest.map(gameLine).join('')}</ul></div>
    </div>
    <div class="card">
      <h3 class="card-title">All-Time Playoff Record</h3>
      <table><thead><tr><th>Team</th><th class="num">Record</th><th class="num">Win%</th></tr></thead><tbody>${teamRows}</tbody></table>
    </div>
  `;
}

function renderTrendChartSVG(seasons){
  if(seasons.length < 2){
    return `<p class="muted">Need at least two seasons to chart a trend.</p>`;
  }
  const w = Math.max(560, seasons.length * 90), h = 240;
  const padL = 56, padR = 56, padT = 28, padB = 34;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const xStep = seasons.length > 1 ? plotW/(seasons.length-1) : 0;
  const pfMax = Math.max(...seasons.map(s=>s.pf)) * 1.15 || 1;

  const xAt = i => padL + i*xStep;
  const yPF = pf => padT + plotH - (pf/pfMax)*plotH;
  const yWin = wp => padT + plotH - wp*plotH;

  const pfPoints = seasons.map((s,i) => `${xAt(i)},${yPF(s.pf)}`).join(' ');
  const winPoints = seasons.map((s,i) => `${xAt(i)},${yWin(s.winPct)}`).join(' ');
  const expPoints = seasons.map((s,i) => `${xAt(i)},${yWin(s.expectedWinPct != null ? s.expectedWinPct : s.winPct)}`).join(' ');

  const pfDots = seasons.map((s,i) => `<circle cx="${xAt(i)}" cy="${yPF(s.pf)}" r="3.5" fill="#2F4E3D" />`).join('');
  const winDots = seasons.map((s,i) => `<circle cx="${xAt(i)}" cy="${yWin(s.winPct)}" r="3.5" fill="#E8A33D" />`).join('');
  const pfLabels = seasons.map((s,i) => `<text x="${xAt(i)}" y="${yPF(s.pf)-10}" font-size="10" text-anchor="middle" fill="#4A5568" font-family="IBM Plex Mono, monospace">${fmt1(s.pf)}</text>`).join('');
  const winLabels = seasons.map((s,i) => `<text x="${xAt(i)}" y="${yWin(s.winPct)-10}" font-size="10" text-anchor="middle" fill="#C68A2E" font-family="IBM Plex Mono, monospace">${Math.round(s.winPct*100)}%</text>`).join('');
  const xLabels = seasons.map((s,i) => `<text x="${xAt(i)}" y="${h-10}" font-size="11" text-anchor="middle" fill="#1B2A3D" font-family="Big Shoulders Display, sans-serif" font-weight="700">${s.year}</text>`).join('');

  return `
    <div class="trend-chart-wrap">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Points for and win percentage by season">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#C9BC9C" stroke-width="1" />
      <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#C9BC9C" stroke-width="1" />
      <polyline points="${expPoints}" fill="none" stroke="#8C3331" stroke-width="2" stroke-dasharray="5,4" opacity="0.85" />
      <polyline points="${pfPoints}" fill="none" stroke="#2F4E3D" stroke-width="2.5" />
      <polyline points="${winPoints}" fill="none" stroke="#E8A33D" stroke-width="2.5" stroke-dasharray="0" />
      ${pfDots}${winDots}${pfLabels}${winLabels}${xLabels}
    </svg>
    </div>
    <div class="trend-legend">
      <span><span class="dot" style="background:#2F4E3D;"></span>Points For</span>
      <span><span class="dot" style="background:#E8A33D;"></span>Win %</span>
      <span><span class="dot" style="background:#8C3331;"></span>Expected Win % (dashed)</span>
    </div>
  `;
}

function renderSingleLineChartSVG(points, opts){
  const color = (opts && opts.color) || '#2F4E3D';
  const valueFmt = (opts && opts.valueFmt) || (v => fmt1(v));
  if(points.length < 2) return `<p class="muted">Need at least two seasons to chart a trend.</p>`;
  const w = Math.max(500, points.length * 80), h = 200;
  const padL = 50, padR = 30, padT = 26, padB = 32;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const xStep = plotW/(points.length-1);
  const values = points.map(p => p.value);
  const rawMax = Math.max(...values), rawMin = Math.min(0, Math.min(...values));
  const vMax = rawMax + (rawMax-rawMin)*0.15 || 1;
  const vMin = rawMin;
  const xAt = i => padL + i*xStep;
  const yAt = v => padT + plotH - ((v-vMin)/((vMax-vMin)||1))*plotH;
  const pts = points.map((p,i) => `${xAt(i)},${yAt(p.value)}`).join(' ');
  const dots = points.map((p,i) => `<circle cx="${xAt(i)}" cy="${yAt(p.value)}" r="3.5" fill="${color}" />`).join('');
  const labels = points.map((p,i) => `<text x="${xAt(i)}" y="${yAt(p.value)-10}" font-size="10" text-anchor="middle" fill="${color}" font-family="IBM Plex Mono, monospace">${valueFmt(p.value)}</text>`).join('');
  const xLabels = points.map((p,i) => `<text x="${xAt(i)}" y="${h-10}" font-size="11" text-anchor="middle" fill="#1B2A3D" font-family="Big Shoulders Display, sans-serif" font-weight="700">${p.year}</text>`).join('');
  return `
    <div class="trend-chart-wrap">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#C9BC9C" stroke-width="1" />
      <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#C9BC9C" stroke-width="1" />
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" />
      ${dots}${labels}${xLabels}
    </svg>
    </div>`;
}

function renderBarChartSVG(buckets, color){
  color = color || '#2F4E3D';
  if(!buckets || buckets.length === 0) return `<p class="muted">No data yet.</p>`;
  const w = Math.max(500, buckets.length * 64), h = 220;
  const padL = 30, padR = 20, padT = 26, padB = 40;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const gap = plotW/buckets.length;
  const barW = gap * 0.62;
  const maxCount = Math.max(...buckets.map(b=>b.count)) || 1;
  const bars = buckets.map((b,i) => {
    const bh = (b.count/maxCount) * plotH;
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + plotH - bh;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${color}" rx="2" />
      <text x="${x+barW/2}" y="${y-6}" font-size="10" text-anchor="middle" fill="#1B2A3D" font-family="IBM Plex Mono, monospace">${b.count}</text>
      <text x="${x+barW/2}" y="${h-16}" font-size="9.5" text-anchor="middle" fill="#4A5568" font-family="IBM Plex Mono, monospace">${escapeHtml(b.label)}</text>`;
  }).join('');
  return `<div class="trend-chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">${bars}</svg></div>`;
}

function leagueScoringTrend(){
  return SEASONS.map(s => {
    const ppgList = s.standings.map(st => {
      const games = st.wins + st.losses + st.ties;
      return games ? st.pf/games : null;
    }).filter(v => v != null);
    if(ppgList.length === 0) return null;
    return { year: s.year, value: ppgList.reduce((a,b)=>a+b,0)/ppgList.length };
  }).filter(Boolean);
}

function leagueParityTrend(){
  return SEASONS.map(s => {
    const winPcts = s.standings.map(st => pct(st.wins, st.losses, st.ties));
    if(winPcts.length < 2) return null;
    const mean = winPcts.reduce((a,b)=>a+b,0)/winPcts.length;
    const variance = winPcts.reduce((a,b)=>a+(b-mean)*(b-mean),0)/winPcts.length;
    return { year: s.year, value: Math.sqrt(variance) };
  }).filter(Boolean);
}

function parityTakeaway(trend){
  if(trend.length < 2) return '';
  const diff = trend[trend.length-1].value - trend[0].value;
  if(Math.abs(diff) < 0.02) return 'Competitive balance has stayed roughly steady since the league started.';
  return diff < 0
    ? 'The league has gotten more competitive over time &mdash; win percentages are more tightly bunched than in the early years.'
    : 'The league has spread out over time &mdash; win percentages are more varied than in the early years.';
}

function scoreDistribution(year){
  const entries = year == null ? GAME_ENTRIES : GAME_ENTRIES.filter(g => g.season === year);
  if(entries.length === 0) return [];
  const bucketSize = 20;
  const scores = entries.map(e => e.pf);
  const startBucket = Math.floor(Math.min(...scores)/bucketSize) * bucketSize;
  const endBucket = Math.ceil((Math.max(...scores)+1)/bucketSize) * bucketSize;
  const buckets = [];
  for(let b=startBucket; b<endBucket; b+=bucketSize){
    buckets.push({ label: `${b}-${b+bucketSize-1}`, min:b, max:b+bucketSize, count:0 });
  }
  for(const s of scores){
    const idx = Math.floor((s-startBucket)/bucketSize);
    if(buckets[idx]) buckets[idx].count++;
  }
  return buckets;
}

function opponentWinPctInSeason(oppKey, year){
  const team = TEAMS.get(oppKey);
  if(!team) return null;
  const s = team.seasons.find(s => s.year === year);
  if(!s) return null;
  return pct(s.wins, s.losses, s.ties);
}

function sosFor(ownerKey, year){
  const games = GAME_ENTRIES.filter(g => g.teamKey === ownerKey && !g.isPlayoff && (year == null || g.season === year));
  if(games.length === 0) return null;
  let sum=0, count=0;
  for(const g of games){
    const owp = opponentWinPctInSeason(g.oppKey, g.season);
    if(owp != null){ sum += owp; count++; }
  }
  return count ? sum/count : null;
}

function sosTable(year){
  return Array.from(TEAMS.keys())
    .map(k => ({ ownerKey:k, sos: sosFor(k, year) }))
    .filter(r => r.sos != null)
    .sort((a,b) => b.sos - a.sos);
}

function renderMilestones(ownerKey){
  const streak = computeStreaks(ownerKey);
  const { highest, lowest } = highestLowestScoreFor(ownerKey);
  const bestSlot = bestDraftSlotFor(ownerKey);
  const playoffRate = playoffRateFor(ownerKey);
  const titles = titlesFor(ownerKey);
  const toiletBowls = toiletBowlsFor(ownerKey);
  const hasToiletBowl = SEASONS.some(s => s.loserKey);

  const ordinal = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };

  const cards = [
    { label: 'Longest Win Streak', value: `${streak.maxW} games`, sub: streak.maxWCtx ? `${streak.maxWCtx.start.season}\u2013${streak.maxWCtx.end.season} wk${streak.maxWCtx.start.week}\u2013${streak.maxWCtx.end.week}` : '' },
    { label: 'Highest Score', value: highest ? fmt1(highest.pf) : '&mdash;', sub: highest ? `Week ${highest.week}, ${highest.season}` : '' },
    { label: 'Lowest Score', value: lowest ? fmt1(lowest.pf) : '&mdash;', sub: lowest ? `Week ${lowest.week}, ${lowest.season}` : '' },
    { label: 'Best Draft Position', value: bestSlot ? ordinal(bestSlot.slot) : '&mdash;', sub: bestSlot ? `${bestSlot.year}` : 'No draft data' },
    { label: 'Playoff Appearances', value: playoffRate.appearances, sub: `${Math.round(playoffRate.pct*100)}% of seasons` },
    { label: 'Championships', value: titles.count, sub: titles.years.length ? titles.years.join(', ') : 'Still searching' },
  ];
  if(hasToiletBowl){
    cards.push({ label: 'Toilet Bowls', value: toiletBowls.count, sub: toiletBowls.years.length ? toiletBowls.years.join(', ') : 'Never (yet)' });
  }

  return `<div class="milestone-grid">${cards.map(c => `
    <div class="milestone-card">
      <div class="mc-label">${c.label}</div>
      <div class="mc-value">${c.value}</div>
      <div class="mc-sub">${c.sub}</div>
    </div>`).join('')}</div>`;
}

function renderTeamStatCards(ownerKey, year){
  const luck = luckFor(ownerKey, year);
  const luckDelta = luck.actualWins - luck.expectedWins;
  const eff = coachingEffFor(ownerKey, year);
  const team = TEAMS.get(ownerKey);

  let record, winPct, expectedWinPct;
  if(year == null){
    const c = careerStats(ownerKey);
    record = { w:c.wins, l:c.losses, t:c.ties };
    winPct = c.winPct;
  } else {
    const s = team.seasons.find(s => s.year === year);
    record = s ? { w:s.wins, l:s.losses, t:s.ties } : { w:0,l:0,t:0 };
    winPct = pct(record.w, record.l, record.t);
  }
  const totalGames = record.w + record.l + record.t;
  expectedWinPct = totalGames ? luck.expectedWins/totalGames : 0;
  const luckAboveExpected = winPct - expectedWinPct;

  const recordCard = `
    <div class="stat-card">
      <div class="sc-label">${year==null?'Career Record':year+' Record'}</div>
      <div class="sc-value">${record.w}-${record.l}${record.t?('-'+record.t):''}</div>
      <div class="sc-sub">${fmt3(winPct)} Win %</div>
    </div>`;

  const expectedCard = `
    <div class="stat-card">
      <div class="sc-label">Expected Win %</div>
      <div class="sc-value">${fmt3(expectedWinPct)}</div>
      <div class="sc-bar"><div class="sc-bar-fill" style="width:${Math.min(100,Math.max(0,expectedWinPct*100))}%;"></div></div>
      <div class="sc-sub">${luckAboveExpected>=0?'+':''}${fmt3(luckAboveExpected)} Luck vs. Expected</div>
    </div>`;

  const luckCard = `
    <div class="stat-card">
      <div class="sc-label">Luck Rating</div>
      <div class="sc-value">${luckDelta>=0?'+':''}${fmt1(luckDelta)}</div>

  const effCard = `
    <div class="stat-card">
      <div class="sc-label">Coaching Efficiency</div>
      <div class="sc-value">${eff.pct!=null ? fmt1(eff.pct) : 'n/a'}</div>
